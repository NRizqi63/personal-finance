<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Target Keuangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<!-- data-page="goals" -> js/app.js menjalankan initGoalsPage().
     Halaman daftar Target Keuangan (G-2): membaca financeData.goals dari
     localStorage lewat loadGoals() dan menampilkannya lewat helper G-1
     (sortGoals, getGoalStatus, getGoalProgress, describeDeadline). Satu
     app.js & style.css dipakai semua halaman. Tahap ini HANYA tampilan —
     tambah/edit/hapus target menyusul di tahap berikutnya. -->
<body data-page="goals">
  <div class="app app--page">

    <!-- HEADER: tombol kembali + judul halaman (pola budget.html/analytics.html) -->
    <header class="app-header page-header">
      <a class="icon-btn" href="index.html" aria-label="Kembali ke dashboard">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" />
          <path d="m12 19-7-7 7-7" />
        </svg>
      </a>
      <h1 class="greeting-text">Target Keuangan</h1>
    </header>

    <p class="goals-intro">Pantau progress tabungan untuk hal-hal yang ingin kamu capai — dana darurat, laptop baru, liburan, atau target lainnya.</p>

    <!-- RINGKASAN: total terkumpul vs total target, jumlah aktif & tercapai
         (renderGoalsSummary()). Disembunyikan seluruhnya kalau belum ada
         target — empty state di daftar sudah cukup menjelaskan. -->
    <section class="goals-summary" id="goals-summary-section" aria-label="Ringkasan target" hidden>
      <div class="stat-grid" id="goals-summary">
        <!-- Diisi otomatis oleh js/app.js melalui renderGoalsSummary() -->
      </div>
    </section>

    <!-- DAFTAR TARGET: satu card per target, urutan dari sortGoals()
         (belum selesai dulu, deadline terdekat di atas, tercapai paling
         akhir). Belum ada target -> empty state (renderGoalList()). -->
    <section class="goals" aria-label="Daftar target">
      <h2 class="section-title">Daftar Target <span class="section-title-sub" id="goals-count-sub"></span></h2>
      <div class="category-list goal-list" id="goal-list">
        <!-- Diisi otomatis oleh js/app.js melalui renderGoalList() -->
      </div>
      <!-- Kejujuran data: nominal terkumpul tidak dihitung dari transaksi. -->
      <p class="goals-hint" id="goals-hint" hidden>ℹ️ Nominal terkumpul dicatat manual dan belum terhubung dengan saldo atau transaksi.</p>
    </section>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
