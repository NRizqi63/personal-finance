<!doctype html>
<meta charset="utf-8">
<pre id="r">running…</pre>
<script>
const out = []; const ok = (n, c, x = "") => out.push(`${c ? "PASS" : "FAIL"} ${n}${x ? "  (" + x + ")" : ""}`);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const FRONT = new URL("../../frontend/", location.href).href;
const HERE = location.href.replace(/[^/]*$/, "");
const pad = (n) => String(n).padStart(2, "0");
const iso = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const today = new Date(); today.setHours(0, 0, 0, 0); const T = iso(today);
const rel = (n) => iso(new Date(today.getFullYear(), today.getMonth(), today.getDate() + n));
const firstThis = new Date(today.getFullYear(), today.getMonth(), 1), lastPrev = new Date(today.getFullYear(), today.getMonth(), 0), firstPrev = new Date(today.getFullYear(), today.getMonth() - 1, 1);
const TX = [
  { id: 9, title: "Makan Siang", category: "makanan", type: "expense", amount: 25000, isoDate: T, time: "" },
  { id: 8, title: "Belanja Mingguan", category: "belanja", type: "expense", amount: 175000, isoDate: iso(firstThis), time: "" },
  { id: 7, title: "Gaji", category: "lainnya", type: "income", amount: 5000000, isoDate: T, time: "" },
  { id: 6, title: "Bensin", category: "bensin", type: "expense", amount: 40000, isoDate: rel(-2), time: "" },
  { id: 5, title: "Nonton", category: "hiburan", type: "expense", amount: 60000, isoDate: rel(-2), time: "" },
  { id: 4, title: "Tagihan Bulan Lalu", category: "tagihan", type: "expense", amount: 310000, isoDate: iso(lastPrev), time: "" },
  { id: 3, title: "Kopi Awal Bulan Lalu", category: "makanan", type: "expense", amount: 18000, isoDate: iso(firstPrev), time: "" },
  { id: 2, title: "Tanpa Tanggal", category: "makanan", type: "expense", amount: 1000, isoDate: "", time: "" },
  { id: 1, title: "Kategori Hilang", category: "hantu", type: "expense", amount: 5000, isoDate: T, time: "" },
];
const KEYS = ["financeData.transactions", "financeData.budget", "financeData.settings", "financeData.goals"];
const txt = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const $ = (d, id) => d.getElementById(id);

let frame = null;
async function load(url, width = 390) {
  if (frame) frame.remove();
  frame = document.createElement("iframe"); frame.width = width; frame.height = 1800; frame.src = url; document.body.appendChild(frame);
  const r = { errors: [], warns: [] };
  await new Promise(res => frame.onload = res);
  r.d = frame.contentDocument; r.w = frame.contentWindow;
  r.w.addEventListener("error", e => r.errors.push(e.message));
  r.w.console.error = (...a) => r.errors.push("console.error " + a.join(" ")); r.w.console.warn = (...a) => r.warns.push(a.join(" "));
  await wait(350);
  return r;
}
async function open(url, tx = TX, width = 390) {
  if (!frame) await load(new URL("../fixtures/pages/jsf_page.html", location.href).href);
  const w0 = frame.contentWindow;
  try { w0.localStorage.clear(); w0.sessionStorage.clear(); if (tx !== null) w0.localStorage.setItem("financeData.transactions", JSON.stringify(tx)); } catch (e) {}
  return load(url, width);
}
const snapLS = (w) => JSON.stringify(KEYS.map(k => w.localStorage.getItem(k)));
const click = async (el) => { el.focus(); el.click(); await wait(120); };
const norm = (h) => h.replace(/\s+/g, " ").replace(/<script src="[^"]*"><\/script>/g, "").replace(/<!--[\s\S]*?-->/g, "").replace(/ is-open"/g, '"').trim();

(async () => {
  const coreSrc = await (await fetch(FRONT + "js/core.js")).text();
  const anaSrc = await (await fetch(FRONT + "js/analytics.js")).text();
  const appSrc = await (await fetch(new URL("../fixtures/legacy/app.js", location.href).href)).text() /* referensi legacy beku (app.js dihapus pada JS-6) */;
  const html = await (await fetch(FRONT + "analytics.html")).text();
  const legacyHtml = await (await fetch(new URL("../fixtures/pages/analytics_legacy.html", location.href).href)).text();
  const ANA = ["analyticsPage", "analyticsViewDate", "getExpenseByCategory", "getDayBuckets", "getAnalyticsSummary", "getBudgetAlertLevel", "describeDaysLeft", "getAnalyticsInsights", "renderAnalyticsSummary", "shouldShowBarLabel", "renderTimeChart", "syncBarHighlights", "setHoverBar", "setSelectedBar", "TAP_MOVE_THRESHOLD_PX", "setupChartScrub", "renderCategoryChart", "DETAIL_LIST_LIMIT", "renderChartDetail", "renderInsights", "renderAnalytics", "renderAnalyticsPeriod", "setupAnalyticsPeriodNav", "initAnalyticsPage"];

  /* ===================== 1. Parse & dependency ===================== */
  let r = await open(FRONT + "analytics.html"); let { d, w } = r;
  ok("1a. analytics.html memuat core.js lalu analytics.js, tanpa app.js / shared", [...d.querySelectorAll("script[src]")].map(x => x.getAttribute("src")).join(",") === "js/core.js,js/analytics.js");
  ok("1b. kedua file terparse & dieksekusi tanpa error", r.errors.length === 0 && r.warns.length === 0, r.errors.concat(r.warns).join(" | "));
  const fnNames = ANA.filter(n => !["analyticsPage", "analyticsViewDate", "TAP_MOVE_THRESHOLD_PX", "DETAIL_LIST_LIMIT"].includes(n));
  ok("1c. semua fungsi analytics tersedia + helper core (getMonthRange, getExpensesInRange, addDays, getWeeklyComparison, renderTransactionItem)", fnNames.every(n => typeof w[n] === "function") && ["getMonthRange", "getExpensesInRange", "addDays", "isValidIsoDate", "getWeeklyComparison", "renderTransactionItem", "escapeHtml", "formatRupiah", "startOfMonth", "isCurrentMonth", "formatMonthYearID"].every(n => typeof w[n] === "function"));
  ok("1d. state analytics ada di scope global (analyticsViewDate = awal bulan ini, analyticsPage objek)", (() => { try { const v = w.eval("analyticsViewDate"); const p = w.eval("analyticsPage"); return v instanceof w.Date && v.getDate() === 1 && v.getMonth() === today.getMonth() && p && p.selectedKey === null && p.detailExpanded === false && w.eval("DETAIL_LIST_LIMIT") === 5 && w.eval("TAP_MOVE_THRESHOLD_PX") === 8; } catch (e) { return false; } })());
  const names = (s) => s.split("\n").map(l => (l.match(/^(?:function|const|let)\s+([A-Za-z_$][\w$]*)/) || [])[1]).filter(Boolean);
  const nc = names(coreSrc), na = names(anaSrc);
  ok("1e. tidak ada deklarasi ganda (core ∩ analytics = ∅; tidak ada duplikat internal)", nc.every(n => !na.includes(n)) && new Set(na).size === na.length);
  ok("1f. analytics.js berisi persis 24 deklarasi yang dimaksud, urutan asli", na.length === 24 && na.join() === ANA.join(), na.join());
  ok("1g. analytics.js tidak menyalin fungsi core (getMonthRange dkk., getWeeklyComparison, renderTransactionItem)", !/^function (getMonthRange|getExpensesInRange|addDays|isValidIsoDate|countUndatedExpenses|sumAmount|startOfWeek|sumExpense|getWeeklyComparison|renderTransactionItem|renderTransactionListItems|escapeHtml|formatRupiah|recalcFromTransactions)\b/m.test(anaSrc) && !/^(const|let) (financeData|openModals|budgetViewDate)\b/m.test(anaSrc));
  ok("1h. 20 fungsi identik byte-per-byte dengan app.js", fnNames.every(n => { const m = new RegExp(`^function ${n}\\([\\s\\S]*?\\n\\}`, "m"); const a = m.exec(appSrc), b = m.exec(anaSrc); return a && b && a[0] === b[0]; }));
  ok("1i. tidak ada DOMContentLoaded / keydown / document|window listener di analytics.js", !anaSrc.includes('addEventListener("DOMContentLoaded"') && !anaSrc.includes('addEventListener("keydown"') && !/(document|window)\.addEventListener\(/.test(anaSrc));
  ok("1j. analytics.js tidak memanggil fungsi dashboard/goals/transaksi/settings", !/\b(renderSummary|setBalanceVisible|renderRecentTransactions|renderCheckin|setupHeaderActions|refreshDashboard|setupTransactionModal|renderCategoryList|renderAllTransactionsList|renderGoalList|setupGoalEditor|showDataStatus|validateBackup)\s*\(/.test(anaSrc));
  ok("1k. fungsi halaman lain memang absen (isolasi)", ["initDashboard", "setupTransactionModal", "refreshDashboard", "renderGoalList", "setupBudgetEditor", "validateBackup", "renderCalendar"].every(n => typeof w[n] === "undefined"));
  ok("1l. analytics.html vs analytics_legacy.html identik selain tag script & href CSS absolut", (() => { const strip = (h) => h.replace(/<!--[\s\S]*?-->/g, "").replace(/\s*<script src="[^"]*"><\/script>/g, "").replace(/href="[^"]*css\//g, 'href="css/'); return strip(html) === strip(legacyHtml) && strip(html).length > 3000; })());

  /* ===================== 2. Perilaku analytics (ringkas; detail: analyticstest/analyticsperiodtest/charttest) ===================== */
  const MONTHS = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  const label = (dt) => `${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
  ok("2a. periode awal = bulan ini, › & Bulan Ini disabled", txt($(d, "analytics-period-title")) === label(today) && $(d, "analytics-next-month").disabled && $(d, "analytics-this-month").disabled);
  ok("2b. total pengeluaran bulan ini = Rp305.000 (pemasukan & tanpa-tanggal tidak ikut, kategori hilang ikut)", txt($(d, "analytics-summary")).includes("Rp305.000"), txt($(d, "analytics-summary")));
  ok("2c. kategori terbesar = Belanja Rp175.000", /Belanja/.test(txt($(d, "analytics-summary"))) && txt($(d, "analytics-summary")).includes("Rp175.000"));
  ok("2d. chart per tanggal punya batang untuk setiap hari bulan ini; hari ini ditandai", d.querySelectorAll("#bar-chart .bar-col").length === new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate() && d.querySelector("#bar-chart .bar-col.is-current") !== null);
  ok("2e. breakdown kategori: Belanja, Nonton/Hiburan, Bensin, Makanan, Lainnya(hantu)", (() => { const t = txt($(d, "category-chart")); return /Belanja/.test(t) && /Hiburan/.test(t) && /Bensin/.test(t) && /Makanan/.test(t) && /Lainnya/.test(t); })(), txt($(d, "category-chart")).slice(0, 120));
  ok("2f. insight bulan ini dirender", d.querySelectorAll("#insight-list .insight-item").length >= 1 && txt($(d, "insight-period-sub")) === "bulan ini");
  const cur = d.querySelector("#bar-chart .bar-col.is-current"); await click(cur);
  ok("2g. klik batang hari ini: terpilih, detail menampilkan 2 transaksi hari ini (Rp30.000)", cur.classList.contains("is-selected") && /Makan Siang/.test(txt($(d, "chart-detail"))) && /Kategori Hilang/.test(txt($(d, "chart-detail"))) && txt($(d, "chart-detail")).includes("Rp30.000"));
  await click($(d, "btn-reset-selection"));
  ok("2h. reset pilihan mengembalikan detail bulan", !d.querySelector("#bar-chart .bar-col.is-selected") && /Belanja Mingguan/.test(txt($(d, "chart-detail"))));
  await click($(d, "analytics-prev-month"));
  ok("2i. bulan sebelumnya: label, total Rp328.000, › & Bulan Ini aktif, insight diganti catatan", txt($(d, "analytics-period-title")) === label(firstPrev) && txt($(d, "analytics-summary")).includes("Rp328.000") && !$(d, "analytics-next-month").disabled && /bulan berjalan/.test(txt($(d, "insight-list"))));
  await click($(d, "analytics-this-month"));
  ok("2j. Bulan Ini: kembali ke bulan berjalan", txt($(d, "analytics-period-title")) === label(today) && $(d, "analytics-this-month").disabled);
  ok("2k. storage tidak berubah oleh navigasi/klik", snapLS(w) === JSON.stringify([JSON.stringify(TX), null, null, null]));
  r = await open(FRONT + "analytics.html", []); ({ d, w } = r);
  ok("2l. tanpa transaksi: empty state chart & kategori, 0 error", /Belum ada pengeluaran/.test(txt($(d, "time-chart"))) && /Belum ada pengeluaran/.test(txt($(d, "category-chart"))) && r.errors.length === 0);
  r = await open(FRONT + "analytics.html", "{rusak"); ({ d, w } = r);
  ok("2m. storage korup: halaman tetap render, 0 error", $(d, "analytics-period-title") && txt($(d, "analytics-period-title")).length > 0 && r.errors.length === 0);

  /* ===================== 3. Kesetaraan vs app.js (analytics_legacy.html) ===================== */
  const scenarios = [
    ["awal", TX, async () => {}],
    ["kosong", [], async () => {}],
    ["korup", "{rusak", async () => {}],
    ["bar hari ini terpilih", TX, async (d) => { await click(d.querySelector("#bar-chart .bar-col.is-current")); }],
    ["detail diperluas", TX, async (d) => { const t = $(d, "btn-detail-toggle"); if (t) await click(t); }],
    ["bulan sebelumnya", TX, async (d) => { await click($(d, "analytics-prev-month")); }],
    ["2 bulan sebelumnya (kosong)", TX, async (d) => { await click($(d, "analytics-prev-month")); await click($(d, "analytics-prev-month")); }],
    ["mundur lalu Bulan Ini", TX, async (d) => { await click($(d, "analytics-prev-month")); await click($(d, "analytics-this-month")); }],
    ["hover batang (scrub)", TX, async (d) => { const b = d.querySelectorAll("#bar-chart .bar-col")[2]; b.dispatchEvent(new PointerEvent("pointerenter", { bubbles: true })); b.dispatchEvent(new MouseEvent("mouseover", { bubbles: true })); await wait(100); }],
    ["fokus batang via keyboard", TX, async (d) => { const b = d.querySelector("#bar-chart .bar-col.is-current"); b.focus(); await wait(60); }],
  ];
  for (const width of [320, 390, 768, 1280]) {
    for (const [lbl, seed, act] of scenarios) {
      if (width !== 390 && ["hover batang (scrub)", "fokus batang via keyboard"].includes(lbl)) continue;
      // Elemen aktif: tombol yang baru di-disable (mis. "Bulan Ini" setelah kembali ke bulan berjalan) dilepas fokusnya
      // oleh browser secara asinkron (focus fixup) — waktunya tidak deterministik, jadi dinormalkan sebagai "body".
      const activeOf = (d) => { const e = d.activeElement; if (!e || e === d.body || e.disabled) return "body"; return e.id || e.dataset.key || e.className; };
      const a = await open(FRONT + "analytics.html", seed, width); await act(a.d); await wait(200);
      const A = { html: norm(a.d.body.innerHTML), ls: snapLS(a.w), active: activeOf(a.d), title: txt($(a.d, "analytics-period-title")), sum: txt($(a.d, "analytics-summary")), err: a.errors.concat(a.warns), scrollW: a.d.documentElement.scrollWidth, cw: a.d.documentElement.clientWidth };
      const b = await open(new URL("../fixtures/pages/analytics_legacy.html", location.href).href, seed, width); await act(b.d); await wait(200);
      const B = { html: norm(b.d.body.innerHTML), ls: snapLS(b.w), active: activeOf(b.d), title: txt($(b.d, "analytics-period-title")), sum: txt($(b.d, "analytics-summary")), err: b.errors.concat(b.warns) };
      let di = 0; while (di < A.html.length && A.html[di] === B.html[di]) di++;
      ok(`3. @${width} ${lbl}: body.innerHTML identik dengan versi app.js`, A.html === B.html, A.html === B.html ? "" : `pos ${di} SPLIT[${A.html.substr(Math.max(0, di - 30), 80)}] LEGACY[${B.html.substr(Math.max(0, di - 30), 80)}]`);
      ok(`3. @${width} ${lbl}: storage, fokus, periode, ringkasan, error identik; tanpa overflow`, A.ls === B.ls && A.active === B.active && A.title === B.title && A.sum === B.sum && A.err.length === 0 && B.err.length === 0 && A.scrollW <= A.cw, `${A.active}|${B.active} ${A.err.concat(B.err).join(",")} scroll=${A.scrollW}/${A.cw}`);
    }
  }

  /* ===================== 4. Halaman lain tak berubah ===================== */
  for (const [page, id, expect] of [["index.html", "balance-value", "js/core.js,js/transactions-shared.js,js/dashboard.js"], ["goals.html", "goal-list", "js/core.js,js/goals.js"], ["budget.html", "budget-card", "js/core.js,js/budget.js"], ["transactions.html", "all-transaction-list", "js/core.js,js/transactions-shared.js,js/transactions.js"], ["settings.html", "settings-app-version", "js/core.js,js/settings.js"]]) {
    const rr = await open(FRONT + page, TX); await wait(100);
    const scripts = [...rr.d.querySelectorAll("script[src]")].map(x => x.getAttribute("src")).join(",");
    ok(`4. ${page}: script sesuai tahap (${expect}), elemen kunci ada, 0 error`, scripts === expect && rr.d.getElementById(id) !== null && rr.errors.length === 0, scripts + " " + rr.errors.join("|"));
  }

  try { frame.contentWindow.localStorage.clear(); frame.contentWindow.sessionStorage.clear(); } catch (e) {}
  const pass = out.filter(l => l.startsWith("PASS")).length, fail = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("r").textContent = out.join("\n") + `\n\n== ${pass} PASS / ${fail} FAIL ==`;
})().catch(e => { document.getElementById("r").textContent = out.join("\n") + "\nEXCEPTION " + e.message + "\n" + e.stack; });
</script>
