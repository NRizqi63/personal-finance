<script>

const wait = (ms) => new Promise(r => setTimeout(r, ms));

  { id: 5, title: "Belanja Mingguan", category: "belanja", type: "expense", amount: 175000, isoDate: rel(-1), time: "" },
  { id: 4, title: "Gaji", category: "lainnya", type: "income", amount: 5000000, isoDate: rel(0), time: "" },

let frame = null;
async function load(page, width, { empty = false, dismissCheckin = true } = {}) {
  if (frame) frame.remove();
  frame = document.createElement("iframe"); frame.width = width; frame.height = 2200; frame.src = BASE + page;

  document.body.appendChild(frame);
  await new Promise(r => frame.onload = r); await wait(300);

}
async function seed(empty, dismissCheckin, extra = {}) {
  if (!frame) { frame = document.createElement("iframe"); frame.src = BASE + "index.html"; document.body.appendChild(frame); await new Promise(r => frame.onload = r); }
  const w = frame.contentWindow;

    if (dismissCheckin) w.sessionStorage.setItem("checkinDismissed", "true"); else w.sessionStorage.removeItem("checkinDismissed");
    w.localStorage.removeItem("financeData.budget"); w.localStorage.removeItem("financeData.settings"); w.sessionStorage.removeItem("financeData.importNotice");

    if (extra.emptyTx) w.localStorage.removeItem("financeData.transactions");
    if (extra.notice) w.sessionStorage.setItem("financeData.importNotice", "Import berhasil: 1 transaksi dipulihkan dari file backup.");
  } catch (e) {}
}
// Snapshot computed style semua elemen + pseudo ::before/::after + rect.
const SKIP = new Set(["transition", "transition-property", "transition-duration", "transition-timing-function", "transition-delay", "animation", "animation-name", "animation-duration"]);
function snapshot(w, d) {
  const els = [...d.querySelectorAll("html, body, body *")];
  const rows = [];
  for (const el of els) {
    if (el.tagName === "SCRIPT" || el.tagName === "LINK" || el.tagName === "STYLE") continue;
    const parts = [];
    for (const pseudo of [null, "::before", "::after"]) {
      const cs = w.getComputedStyle(el, pseudo);
      const props = [];
      for (let i = 0; i < cs.length; i++) { const p = cs[i]; if (!SKIP.has(p)) props.push(p + ":" + cs.getPropertyValue(p)); }
      parts.push(props.join(";"));
    }
    const r = el.getBoundingClientRect();
    rows.push({ path: pathOf(el), style: parts.join("|"), rect: [r.x, r.y, r.width, r.height].map(v => Math.round(v * 10) / 10).join(",") });
  }
  return rows;
}
function pathOf(el) {
  const bits = [];
  while (el && el.nodeType === 1 && bits.length < 6) { bits.unshift(el.tagName.toLowerCase() + (el.id ? "#" + el.id : "") + (el.className && typeof el.className === "string" ? "." + el.className.trim().split(/\s+/).join(".") : "")); el = el.parentElement; }
  return bits.join(" > ");
}
async function swapToLegacy(d) {
  // Matikan link CSS baru, muat style.css lama — DOM tidak disentuh.
  const links = [...d.querySelectorAll('link[rel="stylesheet"]')].filter(l => /css\/(base|dashboard|goals|analytics|budget|transactions|settings)\.css/.test(l.getAttribute("href")));
  // Referensi = salinan beku style.css legacy di tests/fixtures/legacy (file aslinya dihapus pada JS-6).
  const legacy = d.createElement("link"); legacy.rel = "stylesheet"; legacy.href = new URL("../fixtures/legacy/style.css", location.href).href; legacy.dataset.legacy = "1";
  const loaded = new Promise(r => { legacy.onload = r; legacy.onerror = r; });
  d.head.appendChild(legacy); await loaded;
  links.forEach(l => { l.disabled = true; });
  await wait(150);
  return links.length;
}
let timingOnly = 0;
async function swapBackToSplit(d) {
  const legacy = [...d.querySelectorAll('link[rel="stylesheet"][data-legacy]')];
  legacy.forEach(l => l.remove());
  [...d.querySelectorAll('link[rel="stylesheet"]')].forEach(l => { l.disabled = false; });
  await wait(150);
}
function noMotion(d) { const st = d.createElement("style"); st.id = "__nomotion"; st.textContent = "*,*::before,*::after{transition:none!important;animation:none!important}"; d.head.appendChild(st); }
function compare(a, b) {
  const diffs = [];
  if (a.length !== b.length) diffs.push(`jumlah elemen beda: ${a.length} vs ${b.length}`);
  const n = Math.min(a.length, b.length);
  for (let i = 0; i < n; i++) {
    if (/^html( > body)?$/.test(a[i].path) || /div\.app(\.app--page)?$/.test(a[i].path)) continue; // kontainer: akibat, bukan sebab
    if (/type-toggle-indicator/.test(a[i].path)) continue; // lebar/posisinya inline style dari JS (rAF positionIndicator), tidak deterministik di headless — bukan output CSS
    if (a[i].style !== b[i].style) {
      const pa = a[i].style.split(/[;|]/), pb = b[i].style.split(/[;|]/);
      const firstDiff = pa.find((p, k) => p !== pb[k]) || "?"; const other = pb[pa.findIndex((p, k) => p !== pb[k])] || "?";
      diffs.push(`${a[i].path} :: ${firstDiff}  vs  ${other}`);
    } else if (a[i].rect !== b[i].rect) diffs.push(`${a[i].path} :: rect ${a[i].rect} vs ${b[i].rect}`);
    if (diffs.length >= 6) break;
  }
  return diffs;
}
let scenario = async function (label, page, width, prep, opts = {}) {
  await seed(opts.empty, opts.dismissCheckin !== false, opts);
  let { d, w } = await load(page, width);
  noMotion(d);
  const errors = []; w.addEventListener("error", e => errors.push(e.message));
  if (prep) { await prep(d, w); await wait(120); }
  const A = snapshot(w, d);
  const disabled = await swapToLegacy(d);
  const B = snapshot(w, d);
  // Tukar balik ke CSS split dan snapshot lagi: inline style yang di-set JS
  // lewat rAF (mis. indikator type-toggle) sudah settle di kedua snapshot ini.
  await swapBackToSplit(d);
  const A2 = snapshot(w, d);
  const diffs = compare(A2, B);
  const early = compare(A, B);
  timingOnly += (diffs.length === 0 && early.length > 0) ? 1 : 0;
  ok(`${label} @${width}: computed style ${A.length} elemen identik (split vs style.css)`, disabled === 2 && diffs.length === 0 && errors.length === 0, diffs.slice(0, 3).join(" || ") || (disabled !== 2 ? `link baru ditemukan: ${disabled}` : "") || errors.join("|"));
}
const openTxModal = async (d) => { const b = d.querySelector('[data-action="add-transaction"]'); b.focus(); b.click(); await wait(60); d.getElementById("transaction-modal-overlay").classList.add("is-open"); await wait(500); /* biarkan rAF bersarang positionIndicator() (inline style dari JS) selesai sebelum snapshot */ };

    await scenario("index (goals kosong)", "index.html", width, null, { empty: true });

    await scenario("index (dropdown notifikasi)", "index.html", width, openNotif);
    await scenario("index (tombol ditekan/fokus)", "index.html", width, hoverBtn);
    await scenario("goals", "goals.html", width, null);
    await scenario("goals (kosong)", "goals.html", width, null, { empty: true });
    await scenario("goals (modal edit terbuka)", "goals.html", width, openGoalEdit);
    await scenario("goals (konfirmasi hapus)", "goals.html", width, openGoalConfirm);
    await scenario("goals (modal tambah + validasi gagal)", "goals.html", width, openGoalAdd);
    await scenario("analytics", "analytics.html", width, null);
    await scenario("analytics (bar terpilih + detail)", "analytics.html", width, selectBar);
    await scenario("analytics (bulan sebelumnya)", "analytics.html", width, prevMonth);
    await scenario("budget", "budget.html", width, null);
    await scenario("budget (bulan sebelumnya)", "budget.html", width, async (d) => { d.getElementById("budget-prev-month").click(); await wait(80); });
    await scenario("budget (modal budget bulanan)", "budget.html", width, async (d) => { const b = d.getElementById("btn-edit-budget"); b.focus(); b.click(); await wait(60); d.getElementById("budget-modal-overlay").classList.add("is-open"); });
    await scenario("budget (modal kategori + konfirmasi)", "budget.html", width, async (d) => { const b = d.querySelector('[data-action="edit-category"]'); b.focus(); b.click(); await wait(60); d.getElementById("category-modal-overlay").classList.add("is-open"); d.getElementById("btn-delete-category").click(); await wait(60); d.getElementById("confirm-modal-overlay").classList.add("is-open"); });

    await scenario("transactions (konfirmasi hapus)", "transactions.html", width, async (d) => { const x = d.querySelector('[data-action="delete"]'); if (x) { x.focus(); x.click(); await wait(60); d.getElementById("confirm-modal-overlay").classList.add("is-open"); } });
    await scenario("transactions (kosong)", "transactions.html", width, null, { emptyTx: true });
    await scenario("settings", "settings.html", width, null);
    await scenario("settings (feedback profil + switch)", "settings.html", width, async (d) => { const n = d.getElementById("settings-name"); n.value = " "; n.dispatchEvent(new Event("input", { bubbles: true })); d.getElementById("settings-profile-form").requestSubmit(); d.getElementById("pref-hide-balance").click(); await wait(120); });
    await scenario("settings (modal reset)", "settings.html", width, async (d) => { const b = d.querySelector('[data-reset-target="transactions"]'); b.focus(); b.click(); await wait(60); d.getElementById("reset-modal-overlay").classList.add("is-open"); });

    await scenario("settings (notice + tombol ditekan)", "settings.html", width, async (d) => { const b = d.getElementById("btn-export-json"); b.classList.add("is-pressed"); b.focus(); }, { notice: true });
  }
  // JS-6: semua 6 halaman memuat base.css + <halaman>.css, tidak ada style.css, tidak ada sheet dimuat dua kali.
  for (const page of ["index.html", "goals.html", "analytics.html", "budget.html", "transactions.html", "settings.html"]) {

    ok(`${page}: tepat 2 stylesheet lokal (base.css lalu ${expected}), keduanya berisi rule, tanpa style.css/duplikat`, links.length === 2 && links[0].getAttribute("href") === "css/base.css" && links[1].getAttribute("href") === expected && links.every(l => l.sheet && l.sheet.cssRules.length > 0) && new Set(links.map(l => l.getAttribute("href"))).size === 2, links.map(l => l.getAttribute("href") + ":" + (l.sheet ? l.sheet.cssRules.length : "x")).join(","));
  }
  try { frame.contentWindow.localStorage.removeItem("financeData.goals"); frame.contentWindow.localStorage.removeItem("financeData.transactions"); } catch (e) {}
  out.push(`INFO skenario yang beda hanya karena timing inline-style JS (A≠B tapi A2=B): ${timingOnly}`);

})().catch(e => { document.getElementById("r").textContent = out.join("\n") + "\nEXCEPTION " + e.message + "\n" + e.stack; });
