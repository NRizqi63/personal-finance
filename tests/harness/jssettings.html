    for (const [lbl, seed, act] of scenarios) {
      const a = await open(FRONT + "settings.html", Object.assign({ width }, seed)); await act(a.d, a.w); await wait(200);
      const A = { html: norm(a.d.body.innerHTML).replace(/exportedAt[^,}]*/g, ""), ls: snapLS(a.w), ss: a.w.sessionStorage.getItem("financeData.importNotice"), active: activeOf(a.d), err: a.errors.concat(a.warns), scrollW: a.d.documentElement.scrollWidth, cw: a.d.documentElement.clientWidth };
      const b = await open(new URL("../fixtures/pages/settings_legacy.html", location.href).href, Object.assign({ width }, seed)); await act(b.d, b.w); await wait(200);
      const B = { html: norm(b.d.body.innerHTML).replace(/exportedAt[^,}]*/g, ""), ls: snapLS(b.w), ss: b.w.sessionStorage.getItem("financeData.importNotice"), active: activeOf(b.d), err: b.errors.concat(b.warns) };
      let di = 0; while (di < A.html.length && A.html[di] === B.html[di]) di++;
      ok(`3. @${width} ${lbl}: body.innerHTML identik dengan versi app.js`, A.html === B.html, A.html === B.html ? "" : `pos ${di} SPLIT[${A.html.substr(Math.max(0, di - 30), 80)}] LEGACY[${B.html.substr(Math.max(0, di - 30), 80)}]`);
      ok(`3. @${width} ${lbl}: local/sessionStorage, fokus, error identik; tanpa overflow`, A.ls === B.ls && A.ss === B.ss && A.active === B.active && A.err.length === 0 && B.err.length === 0 && A.scrollW <= A.cw, `${A.active}|${B.active} ${A.err.concat(B.err).join(",")} scroll=${A.scrollW}/${A.cw}`);
    }
  }

  /* ===================== 4. Halaman lain tak berubah ===================== */
  for (const [page, id, expect] of [["index.html", "balance-value", "js/core.js,js/transactions-shared.js,js/dashboard.js"], ["goals.html", "goal-list", "js/core.js,js/goals.js"], ["analytics.html", "analytics-period-title", "js/core.js,js/analytics.js"], ["budget.html", "budget-card", "js/core.js,js/budget.js"], ["transactions.html", "all-transaction-list", "js/core.js,js/transactions-shared.js,js/transactions.js"]]) {
    const rr = await open(FRONT + page); await wait(100);
    const scripts = [...rr.d.querySelectorAll("script[src]")].map(x => x.getAttribute("src")).join(",");
    ok(`4. ${page}: script sesuai tahap (${expect}), elemen kunci ada, 0 error`, scripts === expect && rr.d.getElementById(id) !== null && rr.errors.length === 0, scripts + " " + rr.errors.join("|"));
  }
  ok("4x. tidak ada halaman yang masih memuat app.js", (await Promise.all(["index", "goals", "analytics", "budget", "transactions", "settings"].map(async p => (await (await fetch(FRONT + p + ".html")).text())))).every(h => !/src="js\/app\.js"/.test(h)));

  try { frame.contentWindow.localStorage.clear(); frame.contentWindow.sessionStorage.clear(); } catch (e) {}
  const pass = out.filter(l => l.startsWith("PASS")).length, fail = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("r").textContent = out.join("\n") + `\n\n== ${pass} PASS / ${fail} FAIL ==`;
})().catch(e => { document.getElementById("r").textContent = out.join("\n") + "\nEXCEPTION " + e.message + "\n" + e.stack; });
</script>
