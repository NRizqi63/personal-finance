  ok("1g. fungsi settings identik byte-per-byte dengan app.js kecuali 9 fungsi yang diubah M1 + 1 fungsi baru", fnNames.every(n => { const a = srcOf(appSrc, n), b = srcOf(setSrc, n); if (SETTINGS_NEW.includes(n)) return !a && !!b; if (!a || !b) return false; return SETTINGS_CHANGED.includes(n) ? a !== b : a === b; }), fnNames.filter(n => !SETTINGS_CHANGED.includes(n) && !SETTINGS_NEW.includes(n) && srcOf(appSrc, n) !== srcOf(setSrc, n)).join(","));
  ok("1g2. kesembilan fungsi itu berbeda PERSIS sebatas perubahan M1 yang sudah direview", SETTINGS_CHANGED.every(n => fixMatches(n, srcOf(appSrc, n), srcOf(setSrc, n))), SETTINGS_CHANGED.filter(n => !fixMatches(n, srcOf(appSrc, n), srcOf(setSrc, n))).join(","));
  ok("1h. tidak ada DOMContentLoaded / keydown / document|window listener di settings.js; listener elemen: change/click/input/submit", !setSrc.includes('addEventListener("DOMContentLoaded"') && !setSrc.includes('addEventListener("keydown"') && !/(document|window)\.addEventListener\(/.test(setSrc) && ["change", "click", "input", "submit"].every(ev => setSrc.includes(`addEventListener("${ev}"`)));
  ok("1i. API browser: FileReader, Blob, URL.createObjectURL/revokeObjectURL; tanpa fetch/XHR/eval/new Function", /new FileReader\(/.test(setSrc) && /new Blob\(/.test(setSrc) && /URL\.createObjectURL/.test(setSrc) && /URL\.revokeObjectURL/.test(setSrc) && !/\bfetch\(|XMLHttpRequest|\beval\(|new Function\(/.test(setSrc));
  ok("1j. settings.js tidak memanggil fungsi halaman lain (dashboard/goals/analytics/budget/transaksi)", !/\b(renderSummary|setBalanceVisible|renderRecentTransactions|renderCheckin|setupHeaderActions|refreshDashboard|setupTransactionModal|renderAllTransactionsList|renderGoalList|renderAnalytics|setupBudgetEditor|renderCategoryList)\s*\(/.test(setSrc));
  ok("1k. fungsi halaman lain memang absen (isolasi)", ["initDashboard", "setupTransactionModal", "refreshDashboard", "renderGoalList", "renderAnalytics", "setupBudgetEditor", "renderCalendar", "renderSummary"].every(n => typeof w[n] === "undefined"));
  ok("1l. settings.html vs settings_legacy.html identik selain tag script & tag <link> CSS (JS-6: legacy = style.css tunggal, sekarang base.css + settings.css)", (() => { const strip = (h) => h.replace(/<!--[\s\S]*?-->/g, "").replace(/\s*<script src="[^"]*"><\/script>/g, "").replace(/\s*<link rel="stylesheet" href="[^"]*\.css" \/>/g, "").replace(/\s+/g, " "); return strip(html) === strip(legacyHtml) && strip(html).length > 8000; })());
  ok("1m. versi aplikasi & sapaan preview terisi (initSettingsPage berjalan 1x)", txt($(d, "settings-app-version")) === "V2.2" && txt($(d, "settings-name-preview")).length > 0);

  /* ===================== 2. Perilaku (ringkas; detail: settings*test) ===================== */
  const before = snapLS(w);
  ok("2a. membuka halaman tidak menulis storage; checkinDismissed utuh", snapLS(w) === before && w.sessionStorage.getItem("checkinDismissed") === "true");
  // profil
  type(d, "settings-name", "  Budi  ");
  ok("2b. preview sapaan ikut ketikan (tanpa menyimpan)", /Budi/.test(txt($(d, "settings-name-preview"))) && w.localStorage.getItem("financeData.settings") === null);
  type(d, "settings-name", "   "); $(d, "settings-profile-form").requestSubmit(); await wait(150);
  ok("2c. validasi profil: nama kosong ditolak (feedback error, tidak tersimpan)", !$(d, "settings-name-feedback").hidden && $(d, "settings-name-feedback").dataset.type === "error" && w.localStorage.getItem("financeData.settings") === null);
  type(d, "settings-name", "Budi"); $(d, "settings-profile-form").requestSubmit(); await wait(150);
  ok("2d. simpan profil: settings tersimpan (name Budi, default lain), feedback sukses", (() => { const s = JSON.parse(w.localStorage.getItem("financeData.settings")); return s && s.name === "Budi" && s.hideBalanceOnOpen === false && s.showCheckin === true && $(d, "settings-name-feedback").dataset.type === "success"; })());
  // preferensi (switch)
  $(d, "pref-hide-balance").click(); await wait(100);
  ok("2e. preferensi sembunyikan saldo tersimpan langsung; nama tetap", JSON.parse(w.localStorage.getItem("financeData.settings")).hideBalanceOnOpen === true && JSON.parse(w.localStorage.getItem("financeData.settings")).name === "Budi");
  $(d, "pref-show-checkin").click(); await wait(100);
  ok("2f. preferensi check-in dimatikan tersimpan", JSON.parse(w.localStorage.getItem("financeData.settings")).showCheckin === false);
  // export (tangkap Blob lewat stub URL.createObjectURL)
  let blobs = []; const origCreate = w.URL.createObjectURL; w.URL.createObjectURL = (b) => { blobs.push(b); return "blob:stub"; }; w.URL.revokeObjectURL = () => {};
  const clicks = []; w.HTMLAnchorElement.prototype.click = function () { clicks.push(this.download); };
  await click($(d, "btn-export-json"));
  const jsonText = blobs[0] ? await blobs[0].text() : "";
  ok("2g. export JSON: Blob JSON schema 2 berisi 3 transaksi + 1 target keuangan + settings; nama file backup", blobs.length === 1 && /\.json$/.test(clicks[0]) && (() => { try { const j = JSON.parse(jsonText); return j.app === "personal-finance" && j.schema === 2 && j.data.transactions.length === 3 && j.data.settings.name === "Budi" && Array.isArray(j.data.goals) && j.data.goals.length === 1 && j.data.goals[0].name === "Dana Darurat" && j.counts.goals === 1; } catch (e) { return false; } })(), clicks.join(",") + " " + jsonText.slice(0, 80));
  ok("2g2. feedback export sukses tampil", $(d, "settings-data-status").dataset.type === "success" && !$(d, "settings-data-status").hidden);
  await click($(d, "btn-export-csv"));
  const csv = blobs[1] ? await blobs[1].text() : ""; // catatan: Blob.text() menghapus BOM UTF-8 -> BOM diperiksa dari byte mentah
  const csvBytes = blobs[1] ? new Uint8Array(await blobs[1].arrayBuffer()) : new Uint8Array();
  const csvHasBom = csvBytes[0] === 0xEF && csvBytes[1] === 0xBB && csvBytes[2] === 0xBF;
  ok("2h. export CSV: BOM + header (cell dikutip) + 3 baris CRLF, nama file .csv", blobs.length === 2 && /\.csv$/.test(clicks[1]) && csvHasBom && csv.split("\r\n").filter(Boolean).length === 4 && /"tanggal","jenis","judul","kategori"/.test(csv.split("\r\n")[0]) && /Gaji/.test(csv) && /Bensin/.test(csv), JSON.stringify(csv.slice(0, 120)));
  const afterExport = snapLS(w);
  ok("2i. export tidak mengubah storage", afterExport === snapLS(w) && JSON.parse(w.localStorage.getItem("financeData.transactions")).length === 3);
  // import: invalid
  const beforeImport = snapLS(w);
  await pickFile(d, w, "rusak.json", "{bukan json");
  ok("2j. import JSON korup ditolak: feedback error, tidak ada pending, storage utuh", $(d, "settings-data-status").dataset.type === "error" && w.getPendingImport() === null && snapLS(w) === beforeImport && $(d, "import-modal-overlay").hidden);
  await pickFile(d, w, "lain.json", JSON.stringify({ app: "aplikasi-lain", schema: 1, data: { transactions: [] } }));
  ok("2k. file dari aplikasi lain ditolak", /aplikasi lain/i.test(txt($(d, "settings-data-status"))) && w.getPendingImport() === null);
  await pickFile(d, w, "baru.json", BACKUP({ schema: 3 }));
  ok("2l. schema lebih baru ditolak", /versi aplikasi yang lebih baru|format 3/i.test(txt($(d, "settings-data-status"))) && w.getPendingImport() === null);
  await pickFile(d, w, "kosong.json", "");
  ok("2m. file kosong ditolak", /kosong/i.test(txt($(d, "settings-data-status"))) && w.getPendingImport() === null);
  await pickFile(d, w, "catatan.txt", BACKUP(), "text/plain");
  ok("2n. nama/tipe bukan .json ditolak sebelum dibaca", /\.json/.test(txt($(d, "settings-data-status"))) && w.getPendingImport() === null);
  await pickFile(d, w, "besar.json", "x".repeat(5 * 1024 * 1024 + 1));
  ok("2o. file > 5 MB ditolak", /5 MB/.test(txt($(d, "settings-data-status"))) && w.getPendingImport() === null);
  ok("2p. semua penolakan: storage tidak berubah", snapLS(w) === beforeImport);
  // import: valid (async) -> preview -> konfirmasi -> terapkan
  // Muat ulang halaman dulu: setelah uji file 5 MB, headless kadang masih sibuk (flake yang sama dengan settings3b1test).
  r = await open(FRONT + "settings.html"); ({ d, w } = r); const beforeImport2 = snapLS(w);
  await pickFile(d, w, "backup.json", BACKUP());
  const pend = w.getPendingImport();
  await wait(300);
  ok("2q. file valid: async (FileReader -> validateBackup) selesai, pending terisi (1 valid, 1 dilewati), ringkasan halaman terisi, storage BELUM berubah", pend && pend.ok && pend.counts.validRows === 1 && pend.counts.skippedRows === 1 && !$(d, "import-summary").hidden && txt($(d, "import-summary")).length > 10 && snapLS(w) === beforeImport2);
  const applyBtn = $(d, "btn-import-apply");
  ok("2r. modal konfirmasi impor terbuka OTOMATIS setelah file valid (fokus di modal, body lock), ringkasan meta terisi, tombol Timpa Data danger", !$(d, "import-modal-overlay").hidden && $(d, "import-modal-overlay").contains(d.activeElement) && d.body.classList.contains("is-modal-open") && txt($(d, "import-modal-summary")).length > 10 && txt(applyBtn) === "Timpa Data" && applyBtn.classList.contains("btn--danger"));
  let reloads = 0; w.reloadPage = () => { reloads++; };
  await click(applyBtn); await wait(200);
  const afterApply = JSON.parse(w.localStorage.getItem("financeData.transactions"));
  ok("2s. terapkan: 3 key ditulis dari hasil VALIDASI (1 transaksi 'Dari Backup' id 1, budget 1.5jt, settings Impor), goals tidak disentuh, notice disiapkan, reload dipanggil", afterApply.length === 1 && afterApply[0].title === "Dari Backup" && afterApply[0].id === 1 && JSON.parse(w.localStorage.getItem("financeData.budget")).monthly === 1500000 && JSON.parse(w.localStorage.getItem("financeData.settings")).name === "Impor" && w.localStorage.getItem("financeData.goals") === JSON.stringify(GOALS) && /Import berhasil/.test(w.sessionStorage.getItem("financeData.importNotice") || "") && reloads === 1);
  ok("2t. pending dikosongkan setelah diterapkan (tidak bisa dipakai dua kali)", w.getPendingImport() === null);
  r = await open(FRONT + "settings.html", { notice: "Import berhasil: 1 transaksi dipulihkan dari file backup." }); ({ d, w } = r);
  ok("2u. notice setelah reload tampil sekali lalu dihapus dari sessionStorage", /Import berhasil/.test(txt($(d, "settings-data-status"))) && w.sessionStorage.getItem("financeData.importNotice") === null && w.sessionStorage.getItem("checkinDismissed") === "true");
  // rollback saat tulis gagal
  r = await open(FRONT + "settings.html"); ({ d, w } = r);
  const beforeFail = snapLS(w);
  await pickFile(d, w, "backup.json", BACKUP()); await wait(300);
  w.reloadPage = () => {};
  const origSet = w.Storage.prototype.setItem; let n = 0; w.Storage.prototype.setItem = function (k, v) { if (this === w.localStorage && ++n === 2) throw new Error("QuotaExceeded (simulasi)"); return origSet.call(this, k, v); };
  await click($(d, "btn-import-apply")); await wait(200);
  w.Storage.prototype.setItem = origSet;
  await wait(250);
  ok("2v. tulis gagal di key ke-2: rollback -> storage identik seperti sebelum; modal ditutup & error 'dikembalikan' di status halaman (perilaku lama); tidak reload", snapLS(w) === beforeFail && $(d, "import-modal-overlay").hidden && /dikembalikan/.test(txt($(d, "settings-data-status"))) && $(d, "settings-data-status").dataset.type === "error");
  // reset transaksi
  r = await open(FRONT + "settings.html"); ({ d, w } = r); w.reloadPage = () => {};
  await click(d.querySelector('[data-reset-target="transactions"]'));
  ok("2w. modal reset terbuka: judul, ringkasan '3 transaksi', fokus di modal (bukan tombol konfirmasi)", !$(d, "reset-modal-overlay").hidden && /Hapus Semua Transaksi/.test(txt($(d, "reset-modal-title"))) && /3 transaksi/.test(txt($(d, "reset-modal-summary"))) && $(d, "reset-modal-overlay").contains(d.activeElement) && d.activeElement !== $(d, "btn-reset-confirm"));
  await click($(d, "btn-reset-cancel")); await wait(250); // hidden=true disetel 180ms setelah close()
  ok("2x. Batal reset: storage utuh, fokus kembali ke tombol pemicu", $(d, "reset-modal-overlay").hidden && w.localStorage.getItem("financeData.transactions") !== null && d.activeElement === d.querySelector('[data-reset-target="transactions"]'));
  await click(d.querySelector('[data-reset-target="transactions"]')); await click($(d, "btn-reset-confirm")); await wait(200);
  ok("2y. reset transaksi: hanya key transaksi dihapus (removeItem), budget/settings/goals & checkinDismissed utuh, notice disiapkan", w.localStorage.getItem("financeData.transactions") === null && w.localStorage.getItem("financeData.goals") === JSON.stringify(GOALS) && w.sessionStorage.getItem("checkinDismissed") === "true" && /transaksi sudah dihapus/i.test(w.sessionStorage.getItem("financeData.importNotice") || ""));
  ok("2z. tidak ada localStorage.clear() di settings.js; 0 error/warn sepanjang skenario", !/^\s*localStorage\.clear\(\)/m.test(setSrc) && r.errors.length === 0 && r.warns.length === 0, r.errors.concat(r.warns).join("|"));

  /* ===================== 3. Kesetaraan vs app.js (settings_legacy.html) ===================== */
  const scenarios = [
    ["awal", {}, async () => {}],
    ["storage kosong", { tx: null, goals: null }, async () => {}],
    ["storage korup", { tx: "{rusak" }, async () => {}],
    ["settings tersimpan (nama, hide, no checkin)", { settings: { name: "Sari", hideBalanceOnOpen: true, showCheckin: false } }, async () => {}],
    ["notice setelah reload", { notice: "Import berhasil: 2 transaksi dipulihkan dari file backup." }, async () => {}],
    ["ketik nama (preview)", {}, async (d) => { type(d, "settings-name", "Budi"); await wait(80); }],
    ["simpan nama kosong (validasi)", {}, async (d) => { type(d, "settings-name", " "); $(d, "settings-profile-form").requestSubmit(); await wait(150); }],
    ["simpan nama valid", {}, async (d) => { type(d, "settings-name", "Budi"); $(d, "settings-profile-form").requestSubmit(); await wait(150); }],
    ["toggle preferensi", {}, async (d) => { $(d, "pref-hide-balance").click(); await wait(120); }],
    ["export JSON (feedback)", {}, async (d, w) => { w.URL.createObjectURL = () => "blob:stub"; w.URL.revokeObjectURL = () => {}; w.HTMLAnchorElement.prototype.click = function () {}; await click($(d, "btn-export-json")); }],
    ["import JSON korup", {}, async (d, w) => { await pickFile(d, w, "rusak.json", "{x"); }],
    ["import aplikasi lain", {}, async (d, w) => { await pickFile(d, w, "lain.json", JSON.stringify({ app: "x", schema: 1, data: { transactions: [] } })); }],
    ["import valid: modal konfirmasi", {}, async (d, w) => { await pickFile(d, w, "backup.json", BACKUP()); await wait(300); }],
    ["modal reset budget", {}, async (d) => { await click(d.querySelector('[data-reset-target="budget"]')); await wait(300); }],
    ["Escape di modal reset", {}, async (d) => { await click(d.querySelector('[data-reset-target="settings"]')); key(d, "Escape"); await wait(300); }],
  ];
  for (const width of [320, 390, 1280]) {
    for (const [lbl, seed, act] of scenarios) {
      const a = await open(FRONT + "settings.html", Object.assign({ width }, seed)); await act(a.d, a.w); await wait(200);
      const A = { html: norm(a.d.body.innerHTML).replace(/exportedAt[^,}]*/g, ""), ls: snapLS(a.w), ss: a.w.sessionStorage.getItem("financeData.importNotice"), active: activeOf(a.d), err: a.errors.concat(a.warns), scrollW: a.d.documentElement.scrollWidth, cw: a.d.documentElement.clientWidth };
      const b = await open(new URL("../fixtures/pages/settings_legacy.html", location.href).href, Object.assign({ width }, seed)); await act(b.d, b.w); await wait(200);
      const B = { html: norm(b.d.body.innerHTML).replace(/exportedAt[^,}]*/g, ""), ls: snapLS(b.w), ss: b.w.sessionStorage.getItem("financeData.importNotice"), active: activeOf(b.d), err: b.errors.concat(b.warns) };
      let di = 0; while (di < A.html.length && A.html[di] === B.html[di]) di++;
      ok(`3. @${width} ${lbl}: body.innerHTML identik dengan versi app.js`, A.html === B.html, A.html === B.html ? "" : `pos ${di} SPLIT[${A.html.substr(Math.max(0, di - 30), 80)}] LEGACY[${B.html.substr(Math.max(0, di - 30), 80)}]`);
      ok(`3. @${width} ${lbl}: local/sessionStorage, fokus, error identik; tanpa overflow`, A.ls === B.ls && A.ss === B.ss && A.active === B.active && A.err.length === 0 && B.err.length === 0 && A.scrollW <= A.cw, `${A.active}|${B.active} ${A.err.concat(B.err).join(",")} scroll=${A.scrollW}/${A.cw}`);
    }
  }

  /* ===================== 4. Halaman lain tak berubah ===================== */
  for (const [page, id, expect] of [["index.html", "balance-value", "js/core.js,js/transactions-shared.js,js/dashboard.js"], ["goals.html", "goal-list", "js/core.js,js/goals.js"], ["analytics.html", "analytics-period-title", "js/core.js,js/analytics.js"], ["budget.html", "budget-card", "js/core.js,js/budget.js"], ["transactions.html", "all-transaction-list", "js/core.js,js/transactions-shared.js,js/transactions.js"]]) {
    const rr = await open(FRONT + page); await wait(100);
    const scripts = [...rr.d.querySelectorAll("script[src]")].map(x => x.getAttribute("src")).join(",");
    ok(`4. ${page}: script sesuai tahap (${expect}), elemen kunci ada, 0 error`, scripts === expect && rr.d.getElementById(id) !== null && rr.errors.length === 0, scripts + " " + rr.errors.join("|"));
  }
  ok("4x. tidak ada halaman yang masih memuat app.js", (await Promise.all(["index", "goals", "analytics", "budget", "transactions", "settings"].map(async p => (await (await fetch(FRONT + p + ".html")).text())))).every(h => !/src="js\/app\.js"/.test(h)));

  try { frame.contentWindow.localStorage.clear(); frame.contentWindow.sessionStorage.clear(); } catch (e) {}
  const pass = out.filter(l => l.startsWith("PASS")).length, fail = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("r").textContent = out.join("\n") + `\n\n== ${pass} PASS / ${fail} FAIL ==`;
})().catch(e => { document.getElementById("r").textContent = out.join("\n") + "\nEXCEPTION " + e.message + "\n" + e.stack; });
</script>
