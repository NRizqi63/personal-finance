<!doctype html>
<meta charset="utf-8">
<pre id="r">running…</pre>
<script>
const out = []; const ok = (n, c, x = "") => out.push(`${c ? "PASS" : "FAIL"} ${n}${x ? "  (" + x + ")" : ""}`);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const FRONT = new URL("../../frontend/", location.href).href;
const HERE = location.href.replace(/[^/]*$/, "");
const pad = (n) => String(n).padStart(2, "0");
const iso = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const today = new Date(); today.setHours(0, 0, 0, 0); const T = iso(today);
const rel = (n) => iso(new Date(today.getFullYear(), today.getMonth(), today.getDate() + n));
const firstThis = new Date(today.getFullYear(), today.getMonth(), 1), lastPrev = new Date(today.getFullYear(), today.getMonth(), 0);
const TX = [
  { id: 9, title: "Makan Siang", category: "makanan", type: "expense", amount: 600000, isoDate: T, time: "" },        // makanan 600k/800k = 75% watch
  { id: 8, title: "Belanja", category: "belanja", type: "expense", amount: 475000, isoDate: iso(firstThis), time: "" }, // belanja 475k/500k = 95% near
  { id: 7, title: "Gaji", category: "lainnya", type: "income", amount: 5000000, isoDate: T, time: "" },
  { id: 6, title: "Bensin", category: "bensin", type: "expense", amount: 350000, isoDate: rel(-1), time: "" },       // bensin 350k/300k = over
  { id: 5, title: "Nonton", category: "hiburan", type: "expense", amount: 20000, isoDate: rel(-1), time: "" },       // hiburan 20k/200k = safe
  { id: 4, title: "Tagihan Bulan Lalu", category: "tagihan", type: "expense", amount: 310000, isoDate: iso(lastPrev), time: "" },
  { id: 3, title: "Lain-lain", category: "lainnya", type: "expense", amount: 12000, isoDate: T, time: "" },
  { id: 2, title: "Kategori Hilang", category: "hantu", type: "expense", amount: 5000, isoDate: T, time: "" },
];
const KEYS = ["financeData.transactions", "financeData.budget", "financeData.settings", "financeData.goals"];
const txt = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const $ = (d, id) => d.getElementById(id);

let frame = null;
async function load(url, width = 390) {
  if (frame) frame.remove();
  frame = document.createElement("iframe"); frame.width = width; frame.height = 2000; frame.src = url; document.body.appendChild(frame);
  const r = { errors: [], warns: [] };
  await new Promise(res => frame.onload = res);
  r.d = frame.contentDocument; r.w = frame.contentWindow;
  r.w.addEventListener("error", e => r.errors.push(e.message));
  r.w.console.error = (...a) => r.errors.push("console.error " + a.join(" ")); r.w.console.warn = (...a) => r.warns.push(a.join(" "));
  await wait(350);
  return r;
}
async function open(url, { tx = TX, budget = null, width = 390 } = {}) {
  if (!frame) await load(new URL("../fixtures/pages/jsf_page.html", location.href).href);
  const w0 = frame.contentWindow;
  try { w0.localStorage.clear(); w0.sessionStorage.clear(); if (tx !== null) w0.localStorage.setItem("financeData.transactions", typeof tx === "string" ? tx : JSON.stringify(tx)); if (budget !== null) w0.localStorage.setItem("financeData.budget", typeof budget === "string" ? budget : JSON.stringify(budget)); } catch (e) {}
  return load(url, width);
}
const snapLS = (w) => JSON.stringify(KEYS.map(k => w.localStorage.getItem(k)));
const click = async (el) => { el.focus(); el.click(); await wait(120); };
const type = (d, id, v) => { const f = $(d, id); f.value = v; f.dispatchEvent(new Event("input", { bubbles: true })); f.dispatchEvent(new Event("change", { bubbles: true })); };
const key = (d, k) => { const ev = new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }); d.dispatchEvent(ev); return ev; };
const cardOf = (d, k) => d.querySelector(`#category-list .category-card[data-category="${k}"]`);
const editBtn = (d, k) => d.querySelector(`[data-action="edit-category"][data-key="${k}"]`);
const activeOf = (d) => { const e = d.activeElement; if (!e || e === d.body || e.disabled) return "body"; return e.id || e.dataset.key || e.getAttribute("aria-label") || e.className; };
const norm = (h) => h.replace(/\s+/g, " ").replace(/<script src="[^"]*"><\/script>/g, "").replace(/<!--[\s\S]*?-->/g, "").replace(/ is-open"/g, '"').trim(); // .is-open = rAF bersarang di open(), artefak timing headless

(async () => {
  const coreSrc = await (await fetch(FRONT + "js/core.js")).text();
  const budSrc = await (await fetch(FRONT + "js/budget.js")).text();
  const appSrc = await (await fetch(new URL("../fixtures/legacy/app.js", location.href).href)).text() /* referensi legacy beku (app.js dihapus pada JS-6) */;
  const html = await (await fetch(FRONT + "budget.html")).text();
  const legacyHtml = await (await fetch(new URL("../fixtures/pages/budget_legacy.html", location.href).href)).text();
  const BUD = ["budgetViewDate", "renderCategoryPanel", "renderUnbudgetedRow", "renderCategoryList", "renderBudgetPeriod", "renderBudgetPage", "setupBudgetPeriodNav", "makeCategoryKey", "setupBudgetEditor", "initBudgetPage"];

  /* ===================== 1. Parse & dependency ===================== */
  let r = await open(FRONT + "budget.html"); let { d, w } = r;
  ok("1a. budget.html memuat core.js lalu budget.js, tanpa app.js / shared", [...d.querySelectorAll("script[src]")].map(x => x.getAttribute("src")).join(",") === "js/core.js,js/budget.js");
  ok("1b. kedua file terparse & dieksekusi tanpa error/warn", r.errors.length === 0 && r.warns.length === 0, r.errors.concat(r.warns).join(" | "));
  const fnNames = BUD.filter(n => n !== "budgetViewDate");
  ok("1c. semua fungsi budget tersedia + helper core (renderBudgetSummary, getCategoryUsed, getCategoryBudgetStatus, getUnbudgetedUsed, getTotalCategoryBudget, saveBudget, createModalController, formatAmountDigits)", fnNames.every(n => typeof w[n] === "function") && ["renderBudgetSummary", "getCategoryUsed", "getCategoryBudgetStatus", "getUnbudgetedUsed", "getTotalCategoryBudget", "getTotalUsed", "saveBudget", "createModalController", "formatAmountDigits", "formatRupiah", "escapeHtml", "hasCategory", "isCurrentMonth", "formatMonthYearID", "startOfMonth"].every(n => typeof w[n] === "function"));
  ok("1d. budgetViewDate = tanggal 1 bulan ini (let global, parse-time)", (() => { try { const v = w.eval("budgetViewDate"); return v instanceof w.Date && v.getDate() === 1 && v.getMonth() === today.getMonth(); } catch (e) { return false; } })());
  const names = (s) => s.split("\n").map(l => (l.match(/^(?:function|const|let)\s+([A-Za-z_$][\w$]*)/) || [])[1]).filter(Boolean);
  const nc = names(coreSrc), nb = names(budSrc);
  ok("1e. tidak ada deklarasi ganda (core ∩ budget = ∅; tidak ada duplikat internal)", nc.every(n => !nb.includes(n)) && new Set(nb).size === nb.length);
  ok("1f. budget.js berisi persis 10 deklarasi yang dimaksud, urutan asli", nb.length === 10 && nb.join() === BUD.join(), nb.join());
  ok("1g. budget.js tidak menyalin fungsi core (renderBudgetSummary, kalkulasi, saveBudget, modal, EMOJI_CHOICES)", !/^function (renderBudgetSummary|getCategoryUsed|getTotalUsed|getTotalCategoryBudget|getCategoryBudgetStatus|getUnbudgetedUsed|getBudgetStatus|saveBudget|loadBudget|createModalController|formatAmountDigits|escapeHtml|hasCategory|getCategoryLabel|isSafeObjectKey|recalcFromTransactions)\b/m.test(budSrc) && !/^(const|let) (financeData|openModals|EMOJI_CHOICES|FALLBACK_CATEGORY|DEFAULT_CATEGORIES)\b/m.test(budSrc));
  ok("1h. 9 fungsi identik byte-per-byte dengan app.js", fnNames.every(n => { const m = new RegExp(`^function ${n}\\([\\s\\S]*?\\n\\}`, "m"); const a = m.exec(appSrc), b = m.exec(budSrc); return a && b && a[0] === b[0]; }));
  ok("1i. tidak ada DOMContentLoaded / keydown / document|window listener di budget.js", !budSrc.includes('addEventListener("DOMContentLoaded"') && !budSrc.includes('addEventListener("keydown"') && !/(document|window)\.addEventListener\(/.test(budSrc));
  ok("1j. budget.js tidak memanggil fungsi dashboard/goals/analytics/transaksi/settings", !/\b(renderSummary|setBalanceVisible|renderRecentTransactions|renderCheckin|setupHeaderActions|refreshDashboard|setupTransactionModal|renderAllTransactionsList|renderGoalList|renderAnalytics|showDataStatus|validateBackup)\s*\(/.test(budSrc));
  ok("1k. fungsi halaman lain memang absen (isolasi)", ["initDashboard", "setupTransactionModal", "refreshDashboard", "renderGoalList", "renderAnalytics", "validateBackup", "renderCalendar", "renderSummary"].every(n => typeof w[n] === "undefined"));
  ok("1l. budget.html vs budget_legacy.html identik selain tag script & tag <link> CSS (JS-6: legacy = style.css tunggal, sekarang base.css + budget.css)", (() => { const strip = (h) => h.replace(/<!--[\s\S]*?-->/g, "").replace(/\s*<script src="[^"]*"><\/script>/g, "").replace(/\s*<link rel="stylesheet" href="[^"]*\.css" \/>/g, "").replace(/\s+/g, " "); return strip(html) === strip(legacyHtml) && strip(html).length > 5000; })());

  /* ===================== 2. Perilaku budget (ringkas; detail: budgettest, v22test) ===================== */
  const MONTHS = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  const label = (dt) => `${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
  ok("2a. judul & navigator: Budget Bulan Ini, › & Bulan Ini disabled", txt($(d, "budget-summary-title")) === "Budget Bulan Ini" && txt($(d, "budget-period-title")) === label(today) && $(d, "budget-next-month").disabled && $(d, "budget-this-month").disabled);
  ok("2b. card Budget Bulan Ini: terpakai Rp1.462.000 / Rp2.400.000 (pemasukan tidak ikut), sisa Rp938.000", txt($(d, "budget-card")).includes("Rp1.462.000") && txt($(d, "budget-card")).includes("Rp2.400.000") && txt($(d, "budget-card")).includes("Rp938.000"), txt($(d, "budget-card")));
  ok("2c. status 4 level per kategori: makanan watch 75%, belanja near 95%, bensin over 116,7%, hiburan safe 10%, tagihan safe 0%", cardOf(d, "makanan").querySelector(".category-status").dataset.status === "watch" && txt(cardOf(d, "makanan")).includes("75%") && cardOf(d, "belanja").querySelector(".category-status").dataset.status === "near" && cardOf(d, "bensin").querySelector(".category-status").dataset.status === "over" && txt(cardOf(d, "bensin")).includes("116,7%") && txt(cardOf(d, "bensin")).includes("Lebih Rp50.000") && cardOf(d, "hiburan").querySelector(".category-status").dataset.status === "safe" && cardOf(d, "tagihan").querySelector(".category-status").dataset.status === "safe");
  ok("2d. progress bar lebar dipotong 100% untuk over", cardOf(d, "bensin").querySelector(".progress-bar-fill").style.width === "100%" && cardOf(d, "makanan").querySelector(".progress-bar-fill").style.width === "75%");
  ok("2e. baris 'Pengeluaran lain tanpa budget' = Rp17.000 (2 transaksi: lainnya + kategori hilang)", /2 transaksi/.test(txt(d.querySelector('[data-category="__other"]'))) && txt(d.querySelector('[data-category="__other"]')).includes("Rp17.000"));
  ok("2f. peringatan '1 kategori melebihi budget'", !$(d, "category-note").hidden && /1 kategori/.test(txt($(d, "category-note"))));
  await click($(d, "budget-prev-month"));
  ok("2g. bulan sebelumnya: judul 'Budget <bulan>', terpakai Rp310.000, hint tampil, › aktif", txt($(d, "budget-summary-title")) === `Budget ${label(lastPrev)}` && txt($(d, "budget-card")).includes("Rp310.000") && !$(d, "budget-period-hint").hidden && !$(d, "budget-next-month").disabled);
  await click($(d, "budget-this-month"));
  ok("2h. Bulan Ini: kembali, hint hilang", txt($(d, "budget-summary-title")) === "Budget Bulan Ini" && $(d, "budget-period-hint").hidden);
  // editor budget bulanan
  await click($(d, "btn-edit-budget"));
  ok("2i. modal budget bulanan terbuka, terisi 2.400.000, chip cepat ada, fokus di modal, body lock", !$(d, "budget-modal-overlay").hidden && $(d, "field-budget-monthly").value === "2.400.000" && $(d, "budget-quick-amounts").children.length >= 3 && $(d, "budget-modal-overlay").contains(d.activeElement) && d.body.classList.contains("is-modal-open"));
  type(d, "field-budget-monthly", "3000000"); $(d, "budget-form").requestSubmit(); await wait(250);
  ok("2j. simpan budget bulanan: card & storage diperbarui, modal tertutup, fokus kembali ke Edit", txt($(d, "budget-card")).includes("Rp3.000.000") && JSON.parse(w.localStorage.getItem("financeData.budget")).monthly === 3000000 && $(d, "budget-modal-overlay").hidden && d.activeElement === $(d, "btn-edit-budget"));
  // tambah kategori
  await click($(d, "btn-add-category")); type(d, "field-category-name", ""); $(d, "category-form").requestSubmit(); await wait(100);
  ok("2k. validasi tambah kategori: nama kosong ditolak", !$(d, "category-modal-overlay").hidden && !$(d, "field-category-name").checkValidity());
  type(d, "field-category-name", "Kopi & Jajan"); type(d, "field-category-budget", "150000"); $(d, "category-form").requestSubmit(); await wait(250);
  let b = JSON.parse(w.localStorage.getItem("financeData.budget"));
  ok("2l. tambah kategori: key 'kopi-jajan' (makeCategoryKey), card muncul unset->ada budget, storage", b.categories["kopi-jajan"] && b.categories["kopi-jajan"].budget === 150000 && cardOf(d, "kopi-jajan") !== null && $(d, "category-modal-overlay").hidden);
  // edit + kosongkan budget
  await click(editBtn(d, "hiburan"));
  ok("2m. modal edit kategori terisi (Hiburan, 200.000, emoji aktif)", $(d, "field-category-name").value === "Hiburan" && $(d, "field-category-budget").value === "200.000" && $(d, "emoji-picker").querySelector(".emoji-option.is-active") !== null && !$(d, "btn-clear-budget").hidden);
  await click($(d, "btn-clear-budget")); await wait(250); // close() menyetel hidden lewat setTimeout 180ms — tunggu sebelum membuka modal lagi (race laten, sama di app.js)
  b = JSON.parse(w.localStorage.getItem("financeData.budget"));
  ok("2n. kosongkan budget: budget 0, card jadi 'unset' dengan tombol Atur Budget", b.categories.hiburan.budget === 0 && cardOf(d, "hiburan").classList.contains("category-card--unset") && cardOf(d, "hiburan").querySelector(".btn-set-budget") !== null);
  ok("2o. banner 'belum ada budget' tidak tampil (masih ada kategori lain berbudget)", !$(d, "category-empty-budget"));
  // hapus kategori dengan konfirmasi (batal lalu hapus)
  await click(editBtn(d, "tagihan")); await click($(d, "btn-delete-category"));
  ok("2p. konfirmasi hapus bertumpuk di atas modal edit, menyebut 1 transaksi", !$(d, "confirm-modal-overlay").hidden && !$(d, "category-modal-overlay").hidden && /1 transaksi/.test(txt($(d, "confirm-text"))));
  key(d, "Escape"); await wait(300); // + jeda: close() menyetel hidden lewat setTimeout 180ms sebelum konfirmasi dibuka lagi
  ok("2q. Escape menutup HANYA konfirmasi; modal edit tetap terbuka; kategori tetap ada", $(d, "confirm-modal-overlay").hidden && !$(d, "category-modal-overlay").hidden && JSON.parse(w.localStorage.getItem("financeData.budget")).categories.tagihan);
  await click($(d, "btn-delete-category")); await click($(d, "confirm-delete")); await wait(250); // hidden=true disetel 180ms setelah close()
  b = JSON.parse(w.localStorage.getItem("financeData.budget"));
  ok("2r. hapus kategori: key hilang dari budget, transaksi TIDAK disentuh, kedua modal tertutup, body lepas", !b.categories.tagihan && JSON.parse(w.localStorage.getItem("financeData.transactions")).length === TX.length && $(d, "confirm-modal-overlay").hidden && $(d, "category-modal-overlay").hidden && !d.body.classList.contains("is-modal-open"));
  await click($(d, "budget-prev-month"));
  ok("2s. transaksi kategori terhapus jatuh ke baris 'pengeluaran lain' (bulan sebelumnya: Rp310.000)", txt(d.querySelector('[data-category="__other"]')).includes("Rp310.000"));
  ok("2t. 0 error/warn sepanjang interaksi", r.errors.length === 0 && r.warns.length === 0, r.errors.concat(r.warns).join("|"));
  // empty states
  r = await open(FRONT + "budget.html", { budget: { monthly: 2400000, categories: {} } }); ({ d, w } = r);
  ok("2u. tanpa kategori: empty state 'Belum ada kategori', tombol Tambah ada, 0 error", /Belum ada kategori/.test(txt($(d, "category-list"))) && $(d, "btn-add-category") && r.errors.length === 0);
  r = await open(FRONT + "budget.html", { budget: { monthly: 2400000, categories: { makanan: { name: "Makanan", emoji: "🍜", budget: 0 } } } }); ({ d, w } = r);
  ok("2v. semua kategori tanpa budget: banner 'Belum ada budget' + card unset", $(d, "category-empty-budget") !== null && cardOf(d, "makanan").classList.contains("category-card--unset"));
  r = await open(FRONT + "budget.html", { tx: "{rusak", budget: "{rusak" }); ({ d, w } = r);
  ok("2w. storage korup: halaman tetap render dengan seed default (5 kategori), 0 error, storage tidak ditimpa", d.querySelectorAll("#category-list .category-card:not([data-category='__other'])").length === 5 && r.errors.length === 0 && w.localStorage.getItem("financeData.budget") === "{rusak");

  /* ===================== 3. Kesetaraan vs app.js (budget_legacy.html) ===================== */
  const scenarios = [
    ["awal", {}, async () => {}],
    ["tanpa transaksi", { tx: [] }, async () => {}],
    ["tanpa kategori", { budget: { monthly: 2400000, categories: {} } }, async () => {}],
    ["korup", { tx: "{rusak", budget: "{rusak" }, async () => {}],
    ["bulan sebelumnya", {}, async (d) => { await click($(d, "budget-prev-month")); }],
    ["mundur lalu Bulan Ini", {}, async (d) => { await click($(d, "budget-prev-month")); await click($(d, "budget-this-month")); }],
    ["modal budget bulanan terbuka", {}, async (d) => { await click($(d, "btn-edit-budget")); await wait(300); }],
    ["setelah simpan budget bulanan", {}, async (d) => { await click($(d, "btn-edit-budget")); type(d, "field-budget-monthly", "3000000"); $(d, "budget-form").requestSubmit(); await wait(300); }],
    ["modal tambah kategori + validasi gagal", {}, async (d) => { await click($(d, "btn-add-category")); $(d, "category-form").requestSubmit(); await wait(300); }],
    ["setelah tambah kategori", {}, async (d) => { await click($(d, "btn-add-category")); type(d, "field-category-name", "Kopi & Jajan"); type(d, "field-category-budget", "150000"); $(d, "category-form").requestSubmit(); await wait(300); }],
    ["modal edit kategori terbuka", {}, async (d) => { await click(editBtn(d, "makanan")); await wait(300); }],
    ["setelah kosongkan budget", {}, async (d) => { await click(editBtn(d, "hiburan")); await click($(d, "btn-clear-budget")); await wait(300); }],
    ["konfirmasi hapus terbuka", {}, async (d) => { await click(editBtn(d, "tagihan")); await click($(d, "btn-delete-category")); await wait(300); }],
    ["setelah hapus kategori", {}, async (d) => { await click(editBtn(d, "tagihan")); await click($(d, "btn-delete-category")); await click($(d, "confirm-delete")); await wait(300); }],
    ["Escape di konfirmasi (tumpuk)", {}, async (d) => { await click(editBtn(d, "tagihan")); await click($(d, "btn-delete-category")); key(d, "Escape"); await wait(300); }],
  ];
  for (const width of [320, 390, 1280]) {
    for (const [lbl, seed, act] of scenarios) {
      const a = await open(FRONT + "budget.html", Object.assign({ width }, seed)); await act(a.d); await wait(200);
      const A = { html: norm(a.d.body.innerHTML), ls: snapLS(a.w), active: activeOf(a.d), err: a.errors.concat(a.warns), scrollW: a.d.documentElement.scrollWidth, cw: a.d.documentElement.clientWidth };
      const b = await open(new URL("../fixtures/pages/budget_legacy.html", location.href).href, Object.assign({ width }, seed)); await act(b.d); await wait(200);
      const B = { html: norm(b.d.body.innerHTML), ls: snapLS(b.w), active: activeOf(b.d), err: b.errors.concat(b.warns) };
      let di = 0; while (di < A.html.length && A.html[di] === B.html[di]) di++;
      ok(`3. @${width} ${lbl}: body.innerHTML identik dengan versi app.js`, A.html === B.html, A.html === B.html ? "" : `pos ${di} SPLIT[${A.html.substr(Math.max(0, di - 30), 80)}] LEGACY[${B.html.substr(Math.max(0, di - 30), 80)}]`);
      ok(`3. @${width} ${lbl}: storage, fokus, error identik; tanpa overflow`, A.ls === B.ls && A.active === B.active && A.err.length === 0 && B.err.length === 0 && A.scrollW <= A.cw, `${A.active}|${B.active} ${A.err.concat(B.err).join(",")} scroll=${A.scrollW}/${A.cw}`);
    }
  }

  /* ===================== 4. Halaman lain tak berubah ===================== */
  for (const [page, id, expect] of [["index.html", "balance-value", "js/core.js,js/transactions-shared.js,js/dashboard.js"], ["goals.html", "goal-list", "js/core.js,js/goals.js"], ["analytics.html", "analytics-period-title", "js/core.js,js/analytics.js"], ["transactions.html", "all-transaction-list", "js/core.js,js/transactions-shared.js,js/transactions.js"], ["settings.html", "settings-app-version", "js/core.js,js/settings.js"]]) {
    const rr = await open(FRONT + page); await wait(100);
    const scripts = [...rr.d.querySelectorAll("script[src]")].map(x => x.getAttribute("src")).join(",");
    ok(`4. ${page}: script sesuai tahap (${expect}), elemen kunci ada, 0 error`, scripts === expect && rr.d.getElementById(id) !== null && rr.errors.length === 0, scripts + " " + rr.errors.join("|"));
  }

  try { frame.contentWindow.localStorage.clear(); frame.contentWindow.sessionStorage.clear(); } catch (e) {}
  const pass = out.filter(l => l.startsWith("PASS")).length, fail = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("r").textContent = out.join("\n") + `\n\n== ${pass} PASS / ${fail} FAIL ==`;
})().catch(e => { document.getElementById("r").textContent = out.join("\n") + "\nEXCEPTION " + e.message + "\n" + e.stack; });
</script>
