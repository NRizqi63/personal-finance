  ok("2r. hapus kategori: key hilang dari budget, transaksi TIDAK disentuh, kedua modal tertutup, body lepas", !b.categories.tagihan && JSON.parse(w.localStorage.getItem("financeData.transactions")).length === TX.length && $(d, "confirm-modal-overlay").hidden && $(d, "category-modal-overlay").hidden && !d.body.classList.contains("is-modal-open"));
  await click($(d, "budget-prev-month"));
  ok("2s. transaksi kategori terhapus jatuh ke baris 'pengeluaran lain' (bulan sebelumnya: Rp310.000)", txt(d.querySelector('[data-category="__other"]')).includes("Rp310.000"));
  ok("2t. 0 error/warn sepanjang interaksi", r.errors.length === 0 && r.warns.length === 0, r.errors.concat(r.warns).join("|"));
  // empty states
  r = await open(FRONT + "budget.html", { budget: { monthly: 2400000, categories: {} } }); ({ d, w } = r);
  ok("2u. tanpa kategori: empty state 'Belum ada kategori', tombol Tambah ada, 0 error", /Belum ada kategori/.test(txt($(d, "category-list"))) && $(d, "btn-add-category") && r.errors.length === 0);
  r = await open(FRONT + "budget.html", { budget: { monthly: 2400000, categories: { makanan: { name: "Makanan", emoji: "🍜", budget: 0 } } } }); ({ d, w } = r);
  ok("2v. semua kategori tanpa budget: banner 'Belum ada budget' + card unset", $(d, "category-empty-budget") !== null && cardOf(d, "makanan").classList.contains("category-card--unset"));
  r = await open(FRONT + "budget.html", { tx: "{rusak", budget: "{rusak" }); ({ d, w } = r);
  ok("2w. storage korup: halaman tetap render dengan seed default (5 kategori), 0 error, storage tidak ditimpa", d.querySelectorAll("#category-list .category-card:not([data-category='__other'])").length === 5 && r.errors.length === 0 && w.localStorage.getItem("financeData.budget") === "{rusak");

  /* ===================== 3. Kesetaraan vs app.js (budget_legacy.html) ===================== */
  const scenarios = [
    ["awal", {}, async () => {}],
    ["tanpa transaksi", { tx: [] }, async () => {}],
    ["tanpa kategori", { budget: { monthly: 2400000, categories: {} } }, async () => {}],
    ["korup", { tx: "{rusak", budget: "{rusak" }, async () => {}],
    ["bulan sebelumnya", {}, async (d) => { await click($(d, "budget-prev-month")); }],
    ["mundur lalu Bulan Ini", {}, async (d) => { await click($(d, "budget-prev-month")); await click($(d, "budget-this-month")); }],
    ["modal budget bulanan terbuka", {}, async (d) => { await click($(d, "btn-edit-budget")); await wait(300); }],
    ["setelah simpan budget bulanan", {}, async (d) => { await click($(d, "btn-edit-budget")); type(d, "field-budget-monthly", "3000000"); $(d, "budget-form").requestSubmit(); await wait(300); }],
    ["modal tambah kategori + validasi gagal", {}, async (d) => { await click($(d, "btn-add-category")); $(d, "category-form").requestSubmit(); await wait(300); }],
    ["setelah tambah kategori", {}, async (d) => { await click($(d, "btn-add-category")); type(d, "field-category-name", "Kopi & Jajan"); type(d, "field-category-budget", "150000"); $(d, "category-form").requestSubmit(); await wait(300); }],
    ["modal edit kategori terbuka", {}, async (d) => { await click(editBtn(d, "makanan")); await wait(300); }],
    ["setelah kosongkan budget", {}, async (d) => { await click(editBtn(d, "hiburan")); await click($(d, "btn-clear-budget")); await wait(300); }],
    ["konfirmasi hapus terbuka", {}, async (d) => { await click(editBtn(d, "tagihan")); await click($(d, "btn-delete-category")); await wait(300); }],
    ["setelah hapus kategori", {}, async (d) => { await click(editBtn(d, "tagihan")); await click($(d, "btn-delete-category")); await click($(d, "confirm-delete")); await wait(300); }],
    ["Escape di konfirmasi (tumpuk)", {}, async (d) => { await click(editBtn(d, "tagihan")); await click($(d, "btn-delete-category")); key(d, "Escape"); await wait(300); }],
  ];
  for (const width of [320, 390, 1280]) {
    for (const [lbl, seed, act] of scenarios) {
      const a = await open(FRONT + "budget.html", Object.assign({ width }, seed)); await act(a.d); await wait(200);
      const A = { html: norm(a.d.body.innerHTML), ls: snapLS(a.w), active: activeOf(a.d), err: a.errors.concat(a.warns), scrollW: a.d.documentElement.scrollWidth, cw: a.d.documentElement.clientWidth };
      const b = await open(new URL("../fixtures/pages/budget_legacy.html", location.href).href, Object.assign({ width }, seed)); await act(b.d); await wait(200);
      const B = { html: norm(b.d.body.innerHTML), ls: snapLS(b.w), active: activeOf(b.d), err: b.errors.concat(b.warns) };
      let di = 0; while (di < A.html.length && A.html[di] === B.html[di]) di++;
      ok(`3. @${width} ${lbl}: body.innerHTML identik dengan versi app.js`, A.html === B.html, A.html === B.html ? "" : `pos ${di} SPLIT[${A.html.substr(Math.max(0, di - 30), 80)}] LEGACY[${B.html.substr(Math.max(0, di - 30), 80)}]`);
      ok(`3. @${width} ${lbl}: storage, fokus, error identik; tanpa overflow`, A.ls === B.ls && A.active === B.active && A.err.length === 0 && B.err.length === 0 && A.scrollW <= A.cw, `${A.active}|${B.active} ${A.err.concat(B.err).join(",")} scroll=${A.scrollW}/${A.cw}`);
    }
  }

  /* ===================== 4. Halaman lain tak berubah ===================== */
  for (const [page, id, expect] of [["index.html", "balance-value", "js/core.js,js/transactions-shared.js,js/dashboard.js"], ["goals.html", "goal-list", "js/core.js,js/goals.js"], ["analytics.html", "analytics-period-title", "js/core.js,js/analytics.js"], ["transactions.html", "all-transaction-list", "js/core.js,js/transactions-shared.js,js/transactions.js"], ["settings.html", "settings-app-version", "js/core.js,js/settings.js"]]) {
    const rr = await open(FRONT + page); await wait(100);
    const scripts = [...rr.d.querySelectorAll("script[src]")].map(x => x.getAttribute("src")).join(",");
    ok(`4. ${page}: script sesuai tahap (${expect}), elemen kunci ada, 0 error`, scripts === expect && rr.d.getElementById(id) !== null && rr.errors.length === 0, scripts + " " + rr.errors.join("|"));
  }

  try { frame.contentWindow.localStorage.clear(); frame.contentWindow.sessionStorage.clear(); } catch (e) {}
  const pass = out.filter(l => l.startsWith("PASS")).length, fail = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("r").textContent = out.join("\n") + `\n\n== ${pass} PASS / ${fail} FAIL ==`;
})().catch(e => { document.getElementById("r").textContent = out.join("\n") + "\nEXCEPTION " + e.message + "\n" + e.stack; });
</script>
