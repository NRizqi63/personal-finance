<!doctype html>
<meta charset="utf-8">
<pre id="r">running…</pre>
<script>
/* Metode Pembayaran — P-1 (fondasi data) + P-2 (form & simpan).

   1-3 : konstanta & helper di core.js (11 metode populer + fallback legacy)
   4   : pagar tahap — apa yang SUDAH dan BELUM dikerjakan
   5   : P-1 tanpa efek samping
   6   : P-2 form transaksi (opsi, default, tambah, edit, reset, nilai canonical)
   7   : P-3/P-4/P-5 belum tersentuh
   8   : UI-2 aset logo — cadangan saat berkas gagal dimuat

   Renderer, backup/import/CSV, dan filter sengaja belum berubah; bagian 7
   mematoknya supaya tahap berikutnya tidak ter-merge tanpa test-nya sendiri. */
const out = []; const ok = (n, c, x = "") => out.push(`${c ? "PASS" : "FAIL"} ${n}${x ? "  (" + x + ")" : ""}`);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const BASE = new URL("../../frontend/", location.href).href;

const pad = (n) => String(n).padStart(2, "0");
const iso = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const T = iso(new Date());
const TX = [{ id: 1, title: "Makan", category: "makanan", type: "expense", amount: 25000, isoDate: T, time: "" }];

let frame = null;
async function load(page = "index.html") {
  if (!frame) {
    frame = document.createElement("iframe"); frame.width = 390; frame.height = 1600;
    frame.src = BASE + "index.html"; document.body.appendChild(frame);
    await new Promise(r => frame.onload = r);
  }
  try {
    const w0 = frame.contentWindow;
    w0.localStorage.clear(); w0.sessionStorage.clear();
    w0.sessionStorage.setItem("checkinDismissed", "true");
    w0.localStorage.setItem("financeData.transactions", JSON.stringify(TX));
  } catch (e) {}
  frame.remove();
  frame = document.createElement("iframe"); frame.width = 390; frame.height = 1600; frame.src = BASE + page;
  document.body.appendChild(frame);
  await new Promise(r => frame.onload = r); await wait(300);
  const r = { d: frame.contentDocument, w: frame.contentWindow, errors: [] };
  r.w.addEventListener("error", e => r.errors.push(e.message));
  r.w.console.error = (...a) => r.errors.push("console.error " + a.join(" "));
  return r;
}
/** Panggil helper di dalam iframe tanpa pernah melempar ke luar: hasilnya
 * { value } kalau normal, { threw } kalau helper melempar. */
async function tap(el) { el.focus(); el.click(); await wait(120); }
function call(w, fn, arg) {
  try { return { value: w[fn](arg) }; } catch (e) { return { threw: String(e && e.message || e) }; }
}

(async () => {
  const r = await load("index.html"); const { d, w } = r;

  /* ============ 1. KONSTANTA ============ */
  const list = w.eval("PAYMENT_METHODS");
  ok("1a. PAYMENT_METHODS tersedia sebagai array", Array.isArray(list));
  const POPULAR = ["cash", "bca-mobile", "brimo", "livin", "mybca", "wondr", "gopay", "dana", "ovo", "shopeepay", "linkaja"];
  ok("1b. berisi tepat 11 metode populer, urutan sesuai keputusan produk", list.length === 11 && list.map(m => m.key).join() === POPULAR.join(), list.map(m => m.key).join());
  ok("1c. tiap entri punya key, name, emoji, group, logo bertipe string non-kosong", list.every(m => ["key", "name", "emoji", "group", "logo"].every(f => typeof m[f] === "string" && m[f].length > 0)));
  ok("1d. nama tampil sesuai keputusan produk", list.map(m => m.name).join() === "Cash,BCA Mobile,BRImo,Livin' by Mandiri,myBCA,wondr by BNI,GoPay,DANA,OVO,ShopeePay,LinkAja", list.map(m => m.name).join());
  ok("1d2. grup: 1 cash + 5 mbanking + 5 ewallet, dan hanya tiga grup itu", (() => {
    const g = list.reduce((acc, m) => (acc[m.group] = (acc[m.group] || 0) + 1, acc), {});
    return Object.keys(g).sort().join() === "cash,ewallet,mbanking" && g.cash === 1 && g.mbanking === 5 && g.ewallet === 5;
  })(), JSON.stringify(list.map(m => m.group)));
  ok("1d3. grup tiap metode tepat: Cash -> cash, lima bank -> mbanking, lima dompet -> ewallet", list.map(m => `${m.key}:${m.group}`).join() === "cash:cash,bca-mobile:mbanking,brimo:mbanking,livin:mbanking,mybca:mbanking,wondr:mbanking,gopay:ewallet,dana:ewallet,ovo:ewallet,shopeepay:ewallet,linkaja:ewallet", list.map(m => `${m.key}:${m.group}`).join());
  ok("1e. key unik, huruf kecil, hanya a-z & tanda hubung (aman sebagai key data)", new Set(list.map(m => m.key)).size === 11 && list.every(m => /^[a-z][a-z0-9-]*$/.test(m.key)));
  const LEGACY = ["mbanking", "ewallet", "debit", "kredit", "lainnya"];
  const legacyList = w.eval("PAYMENT_LEGACY_METHODS");
  ok("1e2. PAYMENT_METHOD_KEYS = daftar key aktif, urutan sama dengan PAYMENT_METHODS", JSON.stringify(w.eval("PAYMENT_METHOD_KEYS")) === JSON.stringify(POPULAR));
  ok("1e3. PAYMENT_LEGACY_METHODS berisi 5 key generik versi pertama", Array.isArray(legacyList) && legacyList.map(m => m.key).join() === LEGACY.join(), legacyList.map(m => m.key).join());
  ok("1e4. key legacy TIDAK ada di daftar aktif (tidak ditawarkan sebagai pilihan baru)", LEGACY.every(k => !list.some(m => m.key === k)) && LEGACY.every(k => !w.eval("PAYMENT_METHOD_KEYS").includes(k)));
  ok("1e5. Debit / Kredit / PayLater / Lainnya belum masuk daftar aktif", ["debit", "kredit", "paylater", "lainnya"].every(k => !w.eval("PAYMENT_METHOD_KEYS").includes(k)));
  ok("1f. PAYMENT_UNSET adalah string kosong", w.eval("PAYMENT_UNSET") === "" && w.eval("typeof PAYMENT_UNSET") === "string");
  ok("1g. tidak ada key yang bentrok dengan nama bawaan Object", list.every(m => !["__proto__", "constructor", "prototype", "toString"].includes(m.key)));
  ok("1h. helper tersedia sebagai fungsi global", w.eval("typeof getPaymentLabel") === "function" && w.eval("typeof normalizePaymentMethod") === "function");
  ok("1i. daftar aktif & legacy tidak beririsan sama sekali", legacyList.every(l => !list.some(m => m.key === l.key)));

  /* ---- 1L. metadata logo (struktur saja; asetnya menyusul di tahap UI) ---- */
  const LOGO_DIR = w.eval("PAYMENT_LOGO_DIR");
  ok("1L1. PAYMENT_LOGO_DIR terdefinisi & relatif (tanpa protokol, host, atau slash di depan)", LOGO_DIR === "assets/payment-methods/");
  ok("1L2. setiap metode aktif punya logo dengan pola <dir>/<key>.svg", list.every(m => m.logo === `${LOGO_DIR}${m.key}.svg`), list.map(m => m.logo).join(" | "));
  ok("1L3. path logo TIDAK pernah URL eksternal / absolut / naik folder", list.every(m => !/^https?:|^\/\/|^\/|^file:|\.\./.test(m.logo)));
  ok("1L4. satu logo per metode (tidak ada yang dipakai dua metode)", new Set(list.map(m => m.logo)).size === list.length);
  ok("1L5. key legacy TIDAK punya logo (tetap memakai emoji)", legacyList.every(m => m.logo === "" && typeof m.emoji === "string" && m.emoji.length > 0));
  ok("1L6. emoji tetap ada sebagai lambang sementara di SEMUA metode aktif", list.every(m => typeof m.emoji === "string" && m.emoji.length > 0));
  ok("1L7. label aplikasi masih memakai emoji, belum logo (tahap UI belum dikerjakan)", list.every(m => call(w, "getPaymentLabel", m.key).value === `${m.emoji} ${m.name}`) && !/logo/.test(w.eval("String(getPaymentLabel)")));

  /* ============ 2. getPaymentLabel ============ */
  const EXPECTED = { cash: "💵 Cash", "bca-mobile": "🏦 BCA Mobile", brimo: "🏦 BRImo", livin: "🏦 Livin' by Mandiri", mybca: "🏦 myBCA", wondr: "🏦 wondr by BNI", gopay: "📱 GoPay", dana: "📱 DANA", ovo: "📱 OVO", shopeepay: "📱 ShopeePay", linkaja: "📱 LinkAja" };
  const EXPECTED_LEGACY = { mbanking: "🏦 M-Banking", ewallet: "📱 E-Wallet", debit: "💳 Debit", kredit: "🪙 Kredit", lainnya: "🧾 Lainnya" };
  ok("2a. keenam key valid menghasilkan label 'emoji + nama'", Object.keys(EXPECTED).every(k => call(w, "getPaymentLabel", k).value === EXPECTED[k]),
    Object.keys(EXPECTED).map(k => `${k}=${call(w, "getPaymentLabel", k).value}`).join(" | "));
  ok("2b. label dibangun dari konstanta, bukan dari argumen", list.every(m => call(w, "getPaymentLabel", m.key).value === `${m.emoji} ${m.name}`));
  ok("2b2. FALLBACK LEGACY: key lama tetap punya label (transaksi lama tidak kehilangan informasi)", Object.keys(EXPECTED_LEGACY).every(k => call(w, "getPaymentLabel", k).value === EXPECTED_LEGACY[k]),
    Object.keys(EXPECTED_LEGACY).map(k => `${k}=${call(w, "getPaymentLabel", k).value}`).join(" | "));
  const INVALID = [
    ["string kosong", ""], ["undefined", undefined], ["null", null],
    ["angka", 123], ["angka 0", 0], ["boolean", true],
    ["objek", { key: "cash" }], ["array", ["cash"]], ["array kosong", []],
    ["key tidak dikenal", "qris"], ["key katalog (belum ada)", "seabank"], ["huruf besar", "CASH"], ["ada spasi", " cash"],
    ["key populer + spasi", "gopay "], ["paylater (belum dipakai)", "paylater"],
    ["nama bebas", "Cash"], ["nama bebas 2", "M-Banking"], ["nama bebas 3", "BCA Mobile"], ["nama bebas 4", "GoPay"],
    ["__proto__", "__proto__"], ["constructor", "constructor"], ["prototype", "prototype"], ["toString", "toString"],
    ["markup", "<img src=x onerror=alert(1)>"],
  ];
  const badLabel = INVALID.filter(([, v]) => call(w, "getPaymentLabel", v).value !== "");
  ok("2c. SEMUA nilai tidak valid menghasilkan \"\"", badLabel.length === 0, badLabel.map(([n]) => n).join(","));
  ok("2d. getPaymentLabel tidak pernah melempar", INVALID.every(([, v]) => !("threw" in call(w, "getPaymentLabel", v))) && Object.keys(EXPECTED).every(k => !("threw" in call(w, "getPaymentLabel", k))));

  /* ============ 3. normalizePaymentMethod ============ */
  ok("3a. kesebelas key populer dikembalikan apa adanya", list.every(m => call(w, "normalizePaymentMethod", m.key).value === m.key));
  ok("3a2. FALLBACK LEGACY: key lama juga lolos apa adanya (menyunting transaksi lama tidak menghapus metodenya)", LEGACY.every(k => call(w, "normalizePaymentMethod", k).value === k), LEGACY.map(k => `${k}=${call(w, "normalizePaymentMethod", k).value}`).join(" | "));
  const badNorm = INVALID.filter(([, v]) => call(w, "normalizePaymentMethod", v).value !== "");
  ok("3b. SEMUA nilai tidak valid jatuh ke PAYMENT_UNSET (\"\")", badNorm.length === 0, badNorm.map(([n]) => n).join(","));
  ok("3c. hasilnya selalu string (tidak pernah undefined/null/objek)", INVALID.every(([, v]) => typeof call(w, "normalizePaymentMethod", v).value === "string") && list.every(m => typeof call(w, "normalizePaymentMethod", m.key).value === "string"));
  ok("3d. normalizePaymentMethod tidak pernah melempar", INVALID.every(([, v]) => !("threw" in call(w, "normalizePaymentMethod", v))));
  ok("3e. idempoten: normalize(normalize(x)) === normalize(x)", [...INVALID.map(([, v]) => v), ...list.map(m => m.key)].every(v => {
    const once = call(w, "normalizePaymentMethod", v).value;
    return call(w, "normalizePaymentMethod", once).value === once;
  }));
  ok("3f. hasil normalize selalu bisa dipakai getPaymentLabel tanpa error", list.map(m => m.key).concat([""]).every(k => typeof call(w, "getPaymentLabel", call(w, "normalizePaymentMethod", k).value).value === "string"));
  ok("3g. \"__proto__\" tidak mengotori objek apa pun (prototype tetap bersih)", (() => {
    call(w, "normalizePaymentMethod", "__proto__");
    call(w, "getPaymentLabel", "__proto__");
    return w.eval("({}).polluted === undefined && Object.prototype.polluted === undefined");
  })());
  ok("3h. memanggil helper tidak mengubah PAYMENT_METHODS / PAYMENT_LEGACY_METHODS", (() => {
    const after = w.eval("PAYMENT_METHODS"), afterLegacy = w.eval("PAYMENT_LEGACY_METHODS");
    return after.length === 11 && after.map(m => m.key).join() === POPULAR.join() && afterLegacy.map(m => m.key).join() === LEGACY.join();
  })());

  /* ============ 4. PAGAR TAHAP: P-2..P-5 belum dikerjakan ============ */
  const FILES = ["core.js", "transactions-shared.js", "dashboard.js", "goals.js", "analytics.js", "budget.js", "transactions.js", "settings.js"];
  const srcOf = {};
  let assetText = []; // isi berkas SVG, diisi 4L2 lalu dipakai 4L3
  for (const f of FILES) srcOf[f] = await (await fetch(BASE + "js/" + f)).text();
  const allJs = FILES.map(f => srcOf[f]).join("\n");
  const html = { index: await (await fetch(BASE + "index.html")).text(), transactions: await (await fetch(BASE + "transactions.html")).text() };
  // Komentar dibuang saat memeriksa "apakah dipakai di KODE".
  const codeOnly = (s) => s.replace(/\/\*[\s\S]*?\*\//g, "").replace(/(^|\s)\/\/.*$/gm, "$1");

  ok("4a. konstanta didefinisikan HANYA di core.js; pemakainya TEPAT dua file (transactions-shared.js untuk form, settings.js untuk layar kelola)", /const PAYMENT_METHODS = \[/.test(srcOf["core.js"]) && FILES.filter(f => !["core.js", "transactions-shared.js", "settings.js"].includes(f)).every(f => !/PAYMENT_METHODS|PAYMENT_UNSET|getPaymentLabel|normalizePaymentMethod|PaymentMethodActive|getActivePaymentMethods/.test(srcOf[f])) && ["transactions-shared.js", "settings.js"].every(f => !/const PAYMENT_METHODS|const PAYMENT_UNSET|function getPaymentLabel|function normalizePaymentMethod|function setPaymentMethodActive|function savePaymentMethods/.test(srcOf[f])));
  ok("4a2. settings.js hanya MEMBACA state & memakai helper; satu-satunya penulisan langsung adalah pengembalian state saat gagal simpan", (() => {
    // Rollback yang sudah direview dibuang dulu; setelah itu TIDAK boleh ada
    // satu pun penulisan ke disabled/custom di settings.js. Pemeriksaannya
    // mencakup kedua bidang, bukan hanya disabled.
    const bersih = srcOf["settings.js"]
      .replace(/financeData\.paymentMethods\.disabled = (?:before|sebelum\.disabled);/g, "")
      .replace(/financeData\.paymentMethods\.custom = sebelum\.custom;/g, "");
    return !/financeData\.paymentMethods\.(?:disabled|custom)\s*(?:\.push|\.splice|\.pop|\.shift|=(?!=))/.test(bersih)
      && /setPaymentMethodActive\(/.test(srcOf["settings.js"])
      && /addCustomPaymentMethod\(/.test(srcOf["settings.js"])
      && /savePaymentMethods\(\)/.test(srcOf["settings.js"]);
  })());
  ok("4b. P-2 ADA: markup form punya #field-method di kedua halaman", /id="field-method"/.test(html.index) && /id="field-method"/.test(html.transactions) && /name="method"/.test(html.index));
  ok("4c. payload memuat method hasil normalizePaymentMethod, dengan jaga-jaga metode lama saat tidak ada opsi terpilih", /method: fieldMethod\.selectedIndex === -1 \? editingMethod : normalizePaymentMethod\(fieldMethod\.value\),/.test(srcOf["transactions-shared.js"]));
  ok("4c2. P-2: loadTransactions TIDAK mengisi default method ke transaksi lama", !/method/.test((srcOf["core.js"].match(/function loadTransactions\(\)[\s\S]*?\n\}/) || [""])[0]));
  ok("4d. P-3 belum: renderTransactionItem belum menampilkan metode", !/transaction-method|getPaymentLabel/.test((srcOf["core.js"].match(/function renderTransactionItem\([\s\S]*?\n\}/) || [""])[0]));
  ok("4d2. P-3 belum: getPaymentLabel belum dipanggil di mana pun", FILES.every(f => !/getPaymentLabel\(/.test(srcOf[f].replace(/function getPaymentLabel\([\s\S]*?\n\}/, ""))));
  ok("4e. P-4 belum: backup masih schema 2 & validator belum membaca method", /const BACKUP_SCHEMA_VERSION = 2;/.test(srcOf["settings.js"]) && !/raw\.method|normalizePaymentMethod/.test(srcOf["settings.js"]));
  ok("4f. P-4 belum: header CSV belum punya kolom metode", /const CSV_HEADER = \["tanggal", "jenis", "judul", "kategori", "kategori_nama", "jumlah", "waktu"\];/.test(srcOf["settings.js"]));
  ok("4g. P-5 belum: filter transaksi belum mengenal metode", !/method/.test(srcOf["transactions.js"]));
  ok("4h. nama global fitur ini TEPAT tiga puluh (fondasi P-1/R-1 + aktif-nonaktif UI-2a + metode buatan user UI-2b1 + penghapusannya UI-2b2 + satu setup di settings.js)", (() => {
    const names = allJs.split("\n").map(l => (l.match(/^(?:async function|function|const|let)\s+([A-Za-z_$][\w$]*)/) || [])[1]).filter(Boolean);
    const added = names.filter(n => /payment/i.test(n));
    return added.sort().join() === "PAYMENT_CATALOG,PAYMENT_CUSTOM_GROUPS,PAYMENT_CUSTOM_KEY_PATTERN,PAYMENT_CUSTOM_MAX,PAYMENT_CUSTOM_PREFIX,PAYMENT_GROUP_EMOJI,PAYMENT_LEGACY_METHODS,PAYMENT_LOGO_DIR,PAYMENT_METHODS,PAYMENT_METHODS_STORAGE_KEY,PAYMENT_METHOD_KEYS,PAYMENT_NAME_FORBIDDEN,PAYMENT_NAME_MAX,PAYMENT_UNSET,addCustomPaymentMethod,customPaymentMethods,customPaymentView,deleteCustomPaymentMethod,findCustomPaymentMethod,findPaymentMethod,getActivePaymentMethods,getPaymentLabel,isPaymentMethodActive,loadPaymentMethods,normalizePaymentMethod,normalizePaymentName,savePaymentMethods,setPaymentMethodActive,setupPaymentMethodManager,slugifyPaymentName";
  })(), "");
  ok("4L. UI-2: metadata logo DIPAKAI UI — path ditulis SEKALI di core.js, pemakaiannya hanya di transactions-shared.js, markup halaman tetap tidak menyebut nama berkas", /const PAYMENT_LOGO_DIR = "assets\/payment-methods\/";/.test(srcOf["core.js"]) && /img\.src = meta\.logo;/.test(srcOf["transactions-shared.js"]) && FILES.filter(f => f !== "core.js" && f !== "transactions-shared.js").every(f => !/\.logo\b|payment-methods\//.test(codeOnly(srcOf[f]))) && !/payment-methods\//.test(html.index + html.transactions));
  ok("4L2. UI-2: kesebelas aset ADA, berupa SVG lokal yang valid, tanpa rujukan/permintaan ke luar", await (async () => {
    assetText = await Promise.all(list.map(async (m) => {
      try { return await (await fetch(BASE + m.logo)).text(); } catch (e) { return ""; }
    }));
    return assetText.length === 11 && assetText.every((t) => /^<svg[\s\S]*<\/svg>$/.test(t.trim())
      && !/https?:\/\//.test(t.replace(/xmlns="[^"]*"/g, "")) // xmlns bukan permintaan jaringan
      && !/<script|<image|xlink:href|@font-face|url\(/i.test(t));
  })(), "");
  ok("4L3. UI-2: setiap aset MENANDAI DIRINYA placeholder (bukan logo resmi) lewat <title> dan data-placeholder", assetText.length === 11 && assetText.every((t) => /data-placeholder="true"/.test(t) && /bukan logo resmi/.test(t)));
  ok("4L4. UI-2: key legacy tetap TIDAK punya berkas aset (tampilannya memang emoji)", await (async () => {
    const hasil = await Promise.all(LEGACY.map(async (k) => {
      try { const res = await fetch(BASE + "assets/payment-methods/" + k + ".svg"); return !res.ok; }
      catch (e) { return true; } // file:// menolak berkas yang tidak ada
    }));
    return hasil.every(Boolean);
  })());
  ok("4i. UI-2c: slot \"Tambah metode\" diisi DARI JS — markup kedua halaman tetap kosong & hidden, dan modal transaksi tetap tanpa jalur hapus metode", (() => {
    const rapat = (s) => s.replace(/<!--[\s\S]*?-->/g, "").replace(/\s+/g, " ");
    const kosongDiMarkup = (s) => /<div class="method-more" id="method-more" hidden><\/div>/.test(rapat(s));
    return kosongDiMarkup(html.index) && kosongDiMarkup(html.transactions)
      && /methodMore\.append\(/.test(srcOf["transactions-shared.js"])
      && !/deleteCustomPaymentMethod/.test(srcOf["transactions-shared.js"]);
  })());
  ok("4i2. UI-2b1: state metode = daftar yang dimatikan + daftar metode buatan user, dan hanya core.js yang menyimpannya", /paymentMethods: \{ disabled: \[\], custom: \[\] \}/.test(srcOf["core.js"]) && /const PAYMENT_METHODS_STORAGE_KEY = "financeData\.paymentMethods";/.test(srcOf["core.js"]) && FILES.filter(f => f !== "core.js").every(f => !/localStorage\.(?:set|get)Item\(\s*PAYMENT_METHODS_STORAGE_KEY/.test(srcOf[f])));
  ok("4i3. UI-2b1: katalog HANYA daftar saran — tidak pernah ikut disimpan", /const PAYMENT_CATALOG = \[/.test(srcOf["core.js"]) && !/PAYMENT_CATALOG/.test((srcOf["core.js"].match(/function savePaymentMethods\(\)[\s\S]*?\n\}/) || [""])[0]) && !/PAYMENT_CATALOG/.test((srcOf["core.js"].match(/function loadPaymentMethods\(\)[\s\S]*?\n\}/) || [""])[0]));
  ok("4i4. UI-2b2: penghapusan metode custom TIDAK menyentuh halaman transaksi sama sekali (jalurnya hanya lewat Pengaturan)", !/deleteCustomPaymentMethod|method-delete/.test(srcOf["transactions-shared.js"]) && !/Hapus metode|method-delete/.test(html.index + html.transactions) && /function deleteCustomPaymentMethod\(/.test(srcOf["core.js"]));

  /* ============ 5. TIDAK ADA EFEK SAMPING ============ */
  ok("5a. halaman tetap dimuat tanpa error konsol", r.errors.length === 0, r.errors.join(" | "));
  ok("5b. transaksi tersimpan tidak berubah oleh P-1", w.localStorage.getItem("financeData.transactions") === JSON.stringify(TX));
  ok("5c. baris transaksi yang dirender belum memuat metode", (() => {
    const meta = d.querySelector("#transaction-list .transaction-meta");
    return !!meta && !/Cash|M-Banking|E-Wallet|💵|🏦/.test(meta.textContent);
  })());
  ok("5d. transaksi lama (tanpa field method) tetap tampil normal", d.querySelectorAll("#transaction-list .transaction-item").length === 1);

  /* ============ 6. P-2 — FORM & SIMPAN ============ */
  const optionsOf = (doc) => [...doc.getElementById("field-method").options].map(o => ({ value: o.value, text: o.textContent.trim() }));
  const tilesOf = (doc) => [...doc.querySelectorAll("#method-grid .method-option[data-method]")];
  const tileOf = (doc, key) => doc.querySelector(`#method-grid .method-option[data-method="${key}"]`);
  const activeTile = (doc) => doc.querySelector("#method-grid .method-option.is-active");
  const storedTx = (w) => JSON.parse(w.localStorage.getItem("financeData.transactions") || "[]");
  const fill = (doc, { title, amount, category = "makanan", date = T }) => {
    const set = (id, v) => { const f = doc.getElementById(id); f.value = v; f.dispatchEvent(new Event("input", { bubbles: true })); f.dispatchEvent(new Event("change", { bubbles: true })); };
    set("field-title", title); set("field-amount", amount); set("field-date", date);
    doc.getElementById("field-category").value = category;
  };
  const pickMethod = (doc, key) => { const t = tileOf(doc, key); t.focus(); t.click(); };
  // UI-2: slot logo memang berisi <img> lokal. Yang dianggap SAH hanya itu —
  // di dalam .method-logo, src persis salah satu path metadata, alt kosong,
  // tanpa handler inline. <img> lain (mis. dari payload) tetap terhitung asing.
  const strayImgs = (doc) => [...doc.querySelectorAll("#transaction-form img")].filter((img) => !(
    img.parentElement && img.parentElement.classList.contains("method-logo")
    && list.some((m) => m.logo === img.getAttribute("src"))
    && img.getAttribute("alt") === "" && !img.hasAttribute("onerror") && !img.hasAttribute("onload")));
  const settledLogos = (doc) => Promise.all([...doc.querySelectorAll("#method-grid .method-logo img")].map((img) =>
    img.complete ? null : new Promise((res) => { img.addEventListener("load", res, { once: true }); img.addEventListener("error", res, { once: true }); })));

  // --- 6A. field & opsi di KEDUA halaman ---
  for (const page of ["index.html", "transactions.html"]) {
    const rp = await load(page); const dp = rp.d;
    const sel = dp.getElementById("field-method");
    ok(`6a. ${page}: #field-method tetap <select name="method"> sebagai sumber nilai form`, !!sel && sel.tagName === "SELECT" && sel.name === "method");
    ok(`6a2. ${page}: <select> disembunyikan tanpa display:none, tidak bisa di-Tab, tidak dibaca ganda`, sel.classList.contains("visually-hidden") && sel.tabIndex === -1 && sel.getAttribute("aria-hidden") === "true" && rp.w.getComputedStyle(sel).display !== "none");
    ok(`6a3. ${page}: grid tombol ada, role=radiogroup, berlabel`, (() => { const g = dp.getElementById("method-grid"); return !!g && g.getAttribute("role") === "radiogroup" && dp.getElementById(g.getAttribute("aria-labelledby")) !== null; })());
    ok(`6a4. ${page}: 11 tombol metode, urutan & data-method sama dengan PAYMENT_METHODS`, tilesOf(dp).map(t => t.dataset.method).join() === list.map(m => m.key).join(), tilesOf(dp).map(t => t.dataset.method).join());
    ok(`6a5. ${page}: tiap tombol = slot logo (ukuran tetap) + nama metode saja, tanpa teks grup`, tilesOf(dp).every((t, i) => { const logo = t.querySelector(".method-logo"); const name = t.querySelector(".method-name"); return logo && name && logo.getAttribute("aria-hidden") === "true" && name.textContent.trim() === list[i].name; }));
    await settledLogos(dp);
    ok(`6a5b. ${page}: UI-2 — slot logo berisi <img> dari metadata (src PERSIS PAYMENT_METHODS[].logo, alt kosong, tanpa handler inline)`, tilesOf(dp).every((t, i) => {
      const img = t.querySelector(".method-logo img");
      return !!img && img.getAttribute("src") === list[i].logo && img.getAttribute("alt") === "" && !img.hasAttribute("onerror") && !img.hasAttribute("onload");
    }), tilesOf(dp).map(t => { const im = t.querySelector(".method-logo img"); return im ? im.getAttribute("src") : "-"; }).join(" | "));
    ok(`6a5c. ${page}: kesebelas berkas logo benar-benar termuat (bukan gambar rusak)`, tilesOf(dp).every((t) => {
      const img = t.querySelector(".method-logo img");
      return !!img && img.complete && img.naturalWidth > 0;
    }), tilesOf(dp).map(t => { const im = t.querySelector(".method-logo img"); return `${t.dataset.method}=${im ? im.naturalWidth : "?"}`; }).join(" "));
    ok(`6a5d. ${page}: tidak ada <img> lain di form selain slot logo yang sah`, strayImgs(dp).length === 0);
    ok(`6a6. ${page}: grup dipakai sebagai data (data-group), bukan teks di tombol`, tilesOf(dp).every((t, i) => t.dataset.group === list[i].group) && !/Mobile Banking|E-Wallet/.test(dp.getElementById("method-grid").textContent));
    ok(`6a7. ${page}: roving tabindex — hanya SATU tombol yang bisa dicapai Tab`, tilesOf(dp).filter(t => t.tabIndex === 0).length === 1);
    ok(`6a8. ${page}: UI-2c — slot terisi tombol entry point + panel yang TERTUTUP, dan tombolnya type=button (ada di dalam <form> transaksi)`, (() => {
      const more = dp.getElementById("method-more");
      if (!more || more.hidden) return false;
      const btn = more.querySelector("#method-more-open");
      const panel = more.querySelector("#method-more-form");
      return !!btn && btn.type === "button" && btn.getAttribute("aria-expanded") === "false"
        && !!panel && panel.hidden === true;
    })(), (dp.getElementById("method-more") || {}).innerHTML ? "terisi" : "kosong");
    ok(`6b. ${page}: R-2 — opsi form PERSIS 11 metode aktif, urutan sama dengan PAYMENT_METHODS`, optionsOf(dp).map(o => o.value).join() === list.map(m => m.key).join(), optionsOf(dp).map(o => o.value).join());
    ok(`6b2. ${page}: tidak ada satu pun key legacy yang masih jadi pilihan aktif`, LEGACY.every(k => !optionsOf(dp).some(o => o.value === k)) && !optionsOf(dp).some(o => ["debit", "kredit", "lainnya", "paylater"].includes(o.value)));
    ok(`6b3. ${page}: tiga optgroup (Cash, Mobile Banking, E-Wallet) dengan isi 1/5/5 sesuai group di konstanta`, (() => {
      const groups = [...dp.querySelectorAll("#field-method optgroup")];
      const labels = groups.map(g => g.label).join("|");
      const counts = groups.map(g => g.querySelectorAll("option").length).join(",");
      const byGroup = { cash: "cash", mbanking: "Mobile Banking", ewallet: "E-Wallet" };
      const cocok = list.every(m => groups.find(g => [...g.querySelectorAll("option")].some(o => o.value === m.key)).label === (m.group === "cash" ? "Cash" : byGroup[m.group]));
      return labels === "Cash|Mobile Banking|E-Wallet" && counts === "1,5,5" && cocok;
    })());
    ok(`6b4. ${page}: setiap opsi bisa dibaca aplikasi (normalize & label tidak kosong)`, optionsOf(dp).every(o => call(w, "normalizePaymentMethod", o.value).value === o.value && call(w, "getPaymentLabel", o.value).value !== ""));
    ok(`6c. ${page}: teks opsi = label aplikasi untuk key itu (emoji + nama)`, optionsOf(dp).every(o => o.text === call(w, "getPaymentLabel", o.value).value), optionsOf(dp).map(o => o.text).join("|"));
    ok(`6d. ${page}: blok metode berada SEBELUM field tanggal`, (() => {
      const fields = [...dp.querySelectorAll("#transaction-form .form-field")];
      const iM = fields.findIndex(f => f.querySelector("#method-grid"));
      const iD = fields.findIndex(f => f.querySelector("#field-date"));
      return iM > -1 && iD > -1 && iM < iD;
    })());
    ok(`6e. ${page}: tidak wajib diisi (tanpa required)`, !sel.required && !sel.hasAttribute("required"));
  }

  // --- 6B. tambah transaksi: default cash & tersimpan canonical ---
  let rr = await load("index.html"); let dd = rr.d, ww = rr.w;
  await tap(dd.querySelector('[data-action="add-transaction"]'));
  ok("6f. modal tambah: metode default 'cash' (nilai + tombol aktif + aria-checked)", dd.getElementById("field-method").value === "cash" && activeTile(dd) === tileOf(dd, "cash") && tileOf(dd, "cash").getAttribute("aria-checked") === "true");
  fill(dd, { title: "Kopi", amount: "20000" });
  dd.getElementById("transaction-form").requestSubmit();
  await wait(300);
  let saved = storedTx(ww)[0];
  ok("6g. transaksi baru tersimpan dengan method 'cash'", saved.title === "Kopi" && saved.method === "cash", JSON.stringify(saved));
  ok("6h. yang disimpan key canonical, BUKAN label/emoji", !/💵|Cash|M-Banking|🏦/.test(String(saved.method)) && list.some(m => m.key === saved.method));
  ok("6i. field lain tidak berubah bentuknya (8 field)", Object.keys(saved).sort().join() === "amount,category,id,isoDate,method,time,title,type", Object.keys(saved).sort().join());

  // pilih metode lain
  await tap(dd.querySelector('[data-action="add-transaction"]'));
  fill(dd, { title: "Transfer", amount: "50000" });
  pickMethod(dd, "gopay");
  dd.getElementById("transaction-form").requestSubmit();
  await wait(300);
  saved = storedTx(ww)[0];
  ok("6j. metode pilihan user tersimpan apa adanya (key canonical dari daftar aktif)", saved.title === "Transfer" && saved.method === "gopay", String(saved.method));

  // --- 6C. reset form kembali ke cash ---
  await tap(dd.querySelector('[data-action="add-transaction"]'));
  ok("6k. modal dibuka lagi: metode kembali ke 'cash' (nilai & tombol aktif)", dd.getElementById("field-method").value === "cash" && activeTile(dd) === tileOf(dd, "cash"));
  dd.getElementById("modal-close").click(); await wait(400);

  // --- 6D. edit transaksi ---
  rr = await load("transactions.html"); dd = rr.d; ww = rr.w;
  const beforeEdit = ww.localStorage.getItem("financeData.transactions");
  await tap(dd.querySelector('#all-transaction-list [data-action="edit"]'));
  ok("6l. edit transaksi LAMA (tanpa method): tidak ada tombol aktif (tidak diisi 'cash' diam-diam)", dd.getElementById("field-method").value === "" && activeTile(dd) === null && tilesOf(dd).every(t => t.getAttribute("aria-checked") === "false"));
  ok("6l2. grid tetap bisa dimasuki Tab walau belum ada pilihan", tilesOf(dd).filter(t => t.tabIndex === 0).length === 1);
  ok("6m. membuka modal edit TIDAK mengubah data tersimpan", ww.localStorage.getItem("financeData.transactions") === beforeEdit);
  ok("6n. transaksi lama tetap tampil normal saat modal edit terbuka", dd.querySelectorAll("#all-transaction-list .transaction-item").length >= 1 && rr.errors.length === 0, rr.errors.join(" | "));
  pickMethod(dd, "dana");
  dd.getElementById("transaction-form").requestSubmit();
  await wait(300);
  ok("6o. edit menyimpan metode yang dipilih", storedTx(ww).find(t => t.id === 1).method === "dana");

  // edit transaksi yang SUDAH punya method -> preselect benar
  const seedOne = (method) => JSON.stringify([{ id: 5, title: "Listrik", category: "tagihan", type: "expense", amount: 150000, isoDate: T, time: "", method }]);
  rr = await load("transactions.html"); dd = rr.d; ww = rr.w;
  // load() menulis ulang seed; tulis lagi lalu muat ulang halaman saja
  try { ww.localStorage.setItem("financeData.transactions", seedOne("shopeepay")); } catch (e) {}
  ww.location.reload(); await wait(500);
  dd = frame.contentDocument; ww = frame.contentWindow;
  await tap(dd.querySelector('#all-transaction-list [data-action="edit"]'));
  ok("6p. edit transaksi dengan metode aktif: preselect tepat (nilai + tombol aktif)", dd.getElementById("field-method").value === "shopeepay" && activeTile(dd) === tileOf(dd, "shopeepay"));
  dd.getElementById("modal-close").click(); await wait(400);

  // Metode LEGACY: tidak ada di daftar aktif, jadi tidak bisa ditampilkan —
  // tapi menyimpan ulang transaksinya TIDAK boleh menghapusnya.
  try { ww.localStorage.setItem("financeData.transactions", seedOne("debit")); } catch (e) {}
  ww.location.reload(); await wait(500);
  dd = frame.contentDocument; ww = frame.contentWindow;
  await tap(dd.querySelector('#all-transaction-list [data-action="edit"]'));
  ok("6p2. metode legacy tidak ditawarkan sebagai pilihan aktif", dd.getElementById("field-method").value === "" && tilesOf(dd).length === 11 && !tileOf(dd, "debit"));
  ok("6p2b. UI-1d: metode lama DITAMPILKAN sebagai tombol non-aktif dengan penjelasan", (() => {
    const legacy = dd.querySelector("#method-grid .method-option.is-legacy");
    return !!legacy && legacy.disabled && legacy.getAttribute("aria-disabled") === "true" && legacy.tabIndex === -1
      && legacy.querySelector(".method-name").textContent.trim() === "Debit — tidak lagi tersedia"
      && legacy.querySelector(".method-logo").textContent === "💳";
  })(), (dd.querySelector("#method-grid .method-option.is-legacy") || {}).textContent);
  ok("6p2c. tombol legacy tidak ikut navigasi/sinkronisasi (tanpa data-method)", !dd.querySelector("#method-grid .method-option.is-legacy").dataset.method);
  ok("6p3. label metode legacy tetap dikenali aplikasi (data tidak kehilangan arti)", call(ww, "getPaymentLabel", "debit").value === "💳 Debit");
  dd.getElementById("transaction-form").requestSubmit();
  await wait(300);
  ok("6p4. menyimpan ulang transaksi lama MEMPERTAHANKAN metode legacy-nya", storedTx(ww)[0].method === "debit", String(storedTx(ww)[0].method));
  await tap(dd.querySelector('#all-transaction-list [data-action="edit"]'));
  pickMethod(dd, "brimo");
  dd.getElementById("transaction-form").requestSubmit();
  await wait(300);
  ok("6p5. user tetap bisa menggantinya ke metode aktif", storedTx(ww)[0].method === "brimo");

  // nilai rusak di storage
  try { ww.localStorage.setItem("financeData.transactions", JSON.stringify([{ id: 6, title: "Rusak", category: "makanan", type: "expense", amount: 1000, isoDate: T, time: "", method: "<img src=x onerror=alert(1)>" }])); } catch (e) {}
  ww.location.reload(); await wait(500);
  dd = frame.contentDocument; ww = frame.contentWindow;
  await tap(dd.querySelector('#all-transaction-list [data-action="edit"]'));
  ok("6r. method tidak valid di storage: tidak ada tombol aktif, grid tetap 11, tanpa tombol legacy & tanpa elemen baru", dd.getElementById("field-method").value === "" && tilesOf(dd).length === 11 && !dd.querySelector("#method-grid .method-option.is-legacy") && strayImgs(dd).length === 0);
  dd.getElementById("transaction-form").requestSubmit();
  await wait(300);
  ok("6s. menyimpan ulang membersihkan nilai rusak jadi \"\" (bukan menyimpan markup)", storedTx(ww)[0].method === "");

  /* ============ 6U. UI-1: INTERAKSI GRID ============ */
  rr = await load("index.html"); dd = rr.d; ww = rr.w;
  await tap(dd.querySelector('[data-action="add-transaction"]'));
  // klik memilih
  pickMethod(dd, "dana");
  await wait(60);
  ok("6u1. klik tombol: hanya satu yang aktif & <select> ikut berubah", activeTile(dd) === tileOf(dd, "dana") && dd.getElementById("field-method").value === "dana" && dd.querySelectorAll("#method-grid .method-option.is-active").length === 1);
  ok("6u2. aria-checked mengikuti pilihan", tileOf(dd, "dana").getAttribute("aria-checked") === "true" && tileOf(dd, "cash").getAttribute("aria-checked") === "false");
  ok("6u3. roving tabindex ikut berpindah", tileOf(dd, "dana").tabIndex === 0 && tilesOf(dd).filter(t => t.tabIndex === 0).length === 1);

  // keyboard: panah, Home, End
  const press = (el, key) => { const ev = new ww.KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }); el.dispatchEvent(ev); return ev; };
  tileOf(dd, "cash").focus();
  let ev = press(dd.activeElement, "ArrowRight"); await wait(40);
  ok("6u4. ArrowRight memindah pilihan & fokus ke tombol berikutnya", dd.activeElement === tileOf(dd, "bca-mobile") && dd.getElementById("field-method").value === "bca-mobile" && ev.defaultPrevented);
  press(dd.activeElement, "ArrowLeft"); await wait(40);
  ok("6u5. ArrowLeft kembali ke tombol sebelumnya", dd.activeElement === tileOf(dd, "cash") && dd.getElementById("field-method").value === "cash");
  press(dd.activeElement, "End"); await wait(40);
  ok("6u6. End ke tombol terakhir", dd.activeElement === tileOf(dd, "linkaja") && dd.getElementById("field-method").value === "linkaja");
  press(dd.activeElement, "Home"); await wait(40);
  ok("6u7. Home ke tombol pertama", dd.activeElement === tileOf(dd, "cash") && dd.getElementById("field-method").value === "cash");
  press(dd.activeElement, "ArrowLeft"); await wait(40);
  ok("6u8. panah berputar di ujung (wrap)", dd.activeElement === tileOf(dd, "linkaja"));
  const evTab = press(dd.activeElement, "Tab");
  ok("6u9. Tab TIDAK ditangani grid (tetap milik focus trap modal)", !evTab.defaultPrevented);
  const evEsc = new ww.KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true });
  dd.activeElement.dispatchEvent(evEsc);
  await wait(450);
  ok("6u10. Escape dari dalam grid tetap menutup modal", dd.getElementById("transaction-modal-overlay").hidden === true);

  // simpan lewat pilihan keyboard
  await tap(dd.querySelector('[data-action="add-transaction"]'));
  tileOf(dd, "cash").focus();
  press(dd.activeElement, "ArrowDown"); await wait(40);
  fill(dd, { title: "Lewat keyboard", amount: "12000" });
  dd.getElementById("transaction-form").requestSubmit();
  await wait(300);
  ok("6u11. metode pilihan keyboard ikut tersimpan", storedTx(ww)[0].method === "bca-mobile", String(storedTx(ww)[0].method));
  ok("6u12. tanpa error konsol di alur grid", rr.errors.length === 0, rr.errors.join(" | "));

  /* ============ 7. P-2 TIDAK MENYENTUH TAHAP LAIN ============ */
  ok("7a. renderer belum berubah: baris transaksi tanpa label metode", (() => {
    // halaman terakhir yang dibuka bisa dashboard (#transaction-list) atau
    // Semua Transaksi (#all-transaction-list) — keduanya memakai renderer yang sama.
    const meta = dd.querySelector("#all-transaction-list .transaction-meta, #transaction-list .transaction-meta");
    return !!meta && !/💵|🏦|📱|💳|🪙|Cash|M-Banking|E-Wallet/.test(meta.textContent);
  })());
  const settingsSrc = await (await fetch(BASE + "js/settings.js")).text();
  ok("7b. backup/import/CSV belum berubah: schema 2, CSV 7 kolom, dan TIDAK SATU PUN fungsi backup/impor/CSV/reset menyebut metode", (() => {
    // settings.js sekarang SAH mengurus metode (layar kelola UI-2a), jadi
    // "tidak ada kata method di seluruh file" tidak lagi jadi bukti. Yang
    // diperiksa sekarang isi fungsinya satu per satu — lebih ketat, bukan
    // lebih longgar.
    const FN = ["buildBackup", "buildTransactionsCsv", "exportBackupJson", "exportTransactionsCsv", "importTargetKeys",
      "normalizeBudgetData", "validateBackup", "writeImportedData", "applyPendingImport", "applyDataReset",
      "renderImportSummary", "getResetPlan"];
    const bodies = FN.map((n) => (settingsSrc.match(new RegExp(`^(?:async )?function ${n}\\([\\s\\S]*?\\n\\}`, "m")) || [""])[0]);
    const missing = FN.filter((n, i) => !bodies[i]);
    return !missing.length && !/method/i.test(bodies.join("\n"))
      && /const BACKUP_SCHEMA_VERSION = 2;/.test(settingsSrc)
      && /const CSV_HEADER = \["tanggal", "jenis", "judul", "kategori", "kategori_nama", "jumlah", "waktu"\];/.test(settingsSrc);
  })());
  ok("7c. filter/analitik belum mengenal metode", !/method/.test(await (await fetch(BASE + "js/transactions.js")).text()) && !/method/.test(await (await fetch(BASE + "js/analytics.js")).text()));
  ok("7d. tanpa error konsol sepanjang alur P-2", rr.errors.length === 0, rr.errors.join(" | "));

  /* ============ 8. UI-2 — CADANGAN SAAT LOGO GAGAL DIMUAT ============ */
  // Ditaruh paling akhir: 8b sengaja memuat berkas yang tidak ada, jadi tidak
  // boleh mencemari pemeriksaan konsol di 6u12/7d.
  const rl = await load("index.html"); const dl = rl.d;
  await tap(dl.querySelector('[data-action="add-transaction"]'));
  await settledLogos(dl);
  const tileGo = tileOf(dl, "gopay");
  ok("8a. keadaan awal: slot logo berisi <img>, emoji sudah digantikan", !!tileGo.querySelector(".method-logo img") && tileGo.querySelector(".method-logo").textContent === "");
  tileGo.querySelector(".method-logo img").src = "assets/payment-methods/berkas-sengaja-tidak-ada.svg";
  await wait(500);
  ok("8b. CADANGAN: berkas gagal dimuat -> slot kembali ke EMOJI metode dan <img>-nya dilepas (tombol tidak pernah kosong)", tileGo.querySelector(".method-logo").textContent === "\u{1F4F1}" && !tileGo.querySelector(".method-logo img"), JSON.stringify(tileGo.querySelector(".method-logo").innerHTML));
  ok("8c. kegagalan logo tidak mengubah identitas/aksesibilitas tombol", tileGo.dataset.method === "gopay" && tileGo.getAttribute("role") === "radio" && tileGo.querySelector(".method-name").textContent.trim() === "GoPay");
  pickMethod(dl, "gopay"); await wait(80);
  ok("8d. tombol yang logonya gagal tetap bisa dipilih & tetap menulis ke <select>", dl.getElementById("field-method").value === "gopay" && activeTile(dl) === tileGo && tileGo.getAttribute("aria-checked") === "true");
  ok("8e. tombol lain tidak ikut terpengaruh (logonya tetap <img>)", tilesOf(dl).filter(t => t.querySelector(".method-logo img")).length === 10);

  document.getElementById("r").textContent = out.join("\n") + `\n\nTOTAL PASS=${out.filter(l => l.startsWith("PASS")).length} FAIL=${out.filter(l => l.startsWith("FAIL")).length}`;
})().catch(e => { document.getElementById("r").textContent = out.join("\n") + "\nEXCEPTION " + e.message + "\n" + e.stack; });
</script>
