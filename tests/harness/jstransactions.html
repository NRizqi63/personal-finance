      const B = { html: norm(b.d.body.innerHTML), ls: snapLS(b.w), active: activeOf(b.d), n: items(b.d).length, err: b.errors.concat(b.warns) };

      ok(`3. @${width} ${lbl}: body.innerHTML identik dengan versi app.js`, A.html === B.html, A.html === B.html ? "" : `pos ${di} SPLIT[${A.html.substr(Math.max(0, di - 30), 80)}] LEGACY[${B.html.substr(Math.max(0, di - 30), 80)}]`);
      ok(`3. @${width} ${lbl}: storage, fokus, jumlah item (${A.n}), error identik; tanpa overflow`, A.ls === B.ls && A.active === B.active && A.n === B.n && A.err.length === 0 && B.err.length === 0 && A.scrollW <= A.cw, `${A.active}|${B.active} ${A.n}|${B.n} ${A.err.concat(B.err).join(",")} scroll=${A.scrollW}/${A.cw}`);
    }
  }

  /* ===================== 4. Dashboard masih membaca transaksi & halaman lain tak berubah ===================== */
  r = await open(FRONT + "index.html"); ({ d, w } = r); const cc = $(d, "checkin-close"); if (cc && !$(d, "checkin-overlay").hidden) { cc.click(); await wait(250); }
  ok("4a. dashboard membaca transaksi yang sama: saldo Rp5.291.000, 3 transaksi terbaru, 0 error", txt($(d, "balance-value")) === "Rp5.291.000" && $(d, "transaction-list").querySelectorAll(".transaction-item").length === 3 && r.errors.length === 0, txt($(d, "balance-value")));
  for (const [page, id, expect] of [["index.html", "balance-value", "js/core.js,js/transactions-shared.js,js/dashboard.js"], ["goals.html", "goal-list", "js/core.js,js/goals.js"], ["analytics.html", "analytics-period-title", "js/core.js,js/analytics.js"], ["budget.html", "budget-card", "js/core.js,js/budget.js"], ["settings.html", "settings-app-version", "js/core.js,js/settings.js"]]) {
    const rr = await open(FRONT + page); await wait(100);
    const scripts = [...rr.d.querySelectorAll("script[src]")].map(x => x.getAttribute("src")).join(",");
    ok(`4. ${page}: script sesuai tahap (${expect}), elemen kunci ada, 0 error`, scripts === expect && rr.d.getElementById(id) !== null && rr.errors.length === 0, scripts + " " + rr.errors.join("|"));
  }

  try { frame.contentWindow.localStorage.clear(); frame.contentWindow.sessionStorage.clear(); } catch (e) {}
  const pass = out.filter(l => l.startsWith("PASS")).length, fail = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("r").textContent = out.join("\n") + `\n\n== ${pass} PASS / ${fail} FAIL ==`;
})().catch(e => { document.getElementById("r").textContent = out.join("\n") + "\nEXCEPTION " + e.message + "\n" + e.stack; });
</script>
