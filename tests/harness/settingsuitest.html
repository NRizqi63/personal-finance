<!doctype html>
<meta charset="utf-8">
<pre id="r">running…</pre>
<script>
const out = []; const ok = (n, c, x = "") => out.push(`${c ? "PASS" : "FAIL"} ${n}${x ? "  (" + x + ")" : ""}`);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const BASE = new URL("../../frontend/", location.href).href;
// JS-6: style.css sudah dihapus. Sumber CSS HIDUP untuk pemeriksaan selector = gabungan 7 file split.
const CSS_SPLIT_FILES = ["base.css", "dashboard.css", "goals.css", "analytics.css", "budget.css", "transactions.css", "settings.css"];
async function fetchStyleCss(base) { const parts = []; for (const f of CSS_SPLIT_FILES) parts.push(`/* ==== ${f} ==== */\n` + await (await fetch(base + "css/" + f)).text()); return parts.join("\n"); }
// JS-6: app.js sudah dihapus. Sumber kode HIDUP untuk pemeriksaan regex = gabungan 8 file split (urutan muat).
const APP_SPLIT_FILES = ["core.js", "transactions-shared.js", "dashboard.js", "goals.js", "analytics.js", "budget.js", "transactions.js", "settings.js"];
async function fetchAppJs(base) { const parts = []; for (const f of APP_SPLIT_FILES) parts.push(`/* ==== ${f} ==== */\n` + await (await fetch(base + "js/" + f)).text()); return parts.join("\n"); }

const pad = (n) => String(n).padStart(2, "0");
const today = new Date();
const isoToday = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
const SEED_TX = [{ id: 2, title: "Kopi", category: "makanan", type: "expense", amount: 18000, isoDate: isoToday, time: "" }];
const SEED_BUDGET = { monthly: 1500000, categories: { makanan: { name: "Makanan", emoji: "🍜", budget: 800000 } } };
const backup = (data) => JSON.stringify({ app: "personal-finance", appName: "Personal Finance", schema: 1, appVersion: "V2.2", exportedAt: "2026-09-14T01:32:11.281Z", counts: { transactions: 1, categories: 1 }, data });
const IMPORT_FILE = backup({ transactions: [{ id: 9, title: "Dari File", category: "makanan", type: "expense", amount: 12000, isoDate: isoToday, time: "" }], budget: SEED_BUDGET, settings: { name: "Dari File", hideBalanceOnOpen: false, showCheckin: true } });

let frame = null;
async function load(page = "settings.html", width = 390) {
  if (frame) frame.remove();
  frame = document.createElement("iframe"); frame.width = width; frame.height = 1800; frame.src = BASE + page;
  document.body.appendChild(frame);
  await new Promise(r => frame.onload = r); await wait(400);
  const d = frame.contentDocument, w = frame.contentWindow;
  const cc = d.getElementById("checkin-close"); if (cc && !d.getElementById("checkin-overlay").hidden) { cc.click(); await wait(300); }
  return { d, w };
}
/** Tunggu iframe benar-benar pindah halaman (tanpa bergantung pada onload
 * yang bisa sudah lewat). */
async function waitForPath(rx, ms = 4000) {
  for (let i = 0; i < ms / 100; i += 1) {
    try { if (rx.test(frame.contentWindow.location.pathname)) { await wait(300); return true; } } catch (e) {}
    await wait(100);
  }
  return false;
}
const txt = (el) => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");
const seed = (w) => { try { w.localStorage.clear(); w.sessionStorage.clear(); w.localStorage.setItem("financeData.transactions", JSON.stringify(SEED_TX)); w.localStorage.setItem("financeData.budget", JSON.stringify(SEED_BUDGET)); } catch (e) {} };
const ACTIONS = ["btn-export-json", "btn-export-csv", "btn-import-pick"];
const RESETS = ["transactions", "budget", "settings"];

(async () => {
  let { d, w } = await load("index.html");
  seed(w);
  ({ d, w } = await load("index.html"));
  const errors = []; w.addEventListener("error", e => errors.push(e.message));

  // ================= A. tombol Settings di dashboard =================
  const gear = d.getElementById("btn-settings");
  ok("A1. ikon gear = <a href='settings.html'>, ada aria-label, tanpa aria-haspopup/aria-expanded", gear.tagName === "A" && gear.getAttribute("href") === "settings.html" && gear.getAttribute("aria-label") === "Pengaturan" && !gear.hasAttribute("aria-haspopup") && !gear.hasAttribute("aria-expanded"));
  ok("A2. markup pop-up pengaturan lama sudah hilang seluruhnya", !d.getElementById("settings-panel") && d.querySelectorAll(".settings-menu, .settings-menu-item, [data-setting]").length === 0);
  ok("A3. ikon gear memakai gaya .icon-btn yang sama & target tap >= 40px", gear.classList.contains("icon-btn") && gear.getBoundingClientRect().width >= 40 && gear.getBoundingClientRect().height >= 40);
  gear.click();
  const navigated = await waitForPath(/settings\.html$/);
  d = frame.contentDocument; w = frame.contentWindow;
  ok("A4. klik gear -> settings.html (tanpa pop-up perantara)", navigated && d.body.dataset.page === "settings");
  ok("A5. halaman Pengaturan benar-benar terbuka (section Data & Backup ada)", !!d.getElementById("data") && !!d.getElementById("reset-actions"));
  ({ d, w } = await load("index.html", 320));
  d.getElementById("btn-settings").click();
  const navigated320 = await waitForPath(/settings\.html$/);
  ok("A6. navigasi juga bekerja di lebar 320px (mobile)", navigated320);
  ({ d, w } = await load("index.html"));
  d.getElementById("btn-notification").click(); await wait(300);
  ok("A7. tombol notifikasi TIDAK berubah: masih dropdown & terbuka normal", !d.getElementById("notification-panel").hidden && d.getElementById("btn-notification").getAttribute("aria-expanded") === "true");
  ok("A8. dashboard tetap normal (saldo, daftar transaksi, budget card)", !!d.getElementById("balance-value") && !!d.getElementById("transaction-list") && !!d.getElementById("budget-card"));
  const appJs = await fetchAppJs(BASE);
  const cleanJs = appJs.replace(/\/\*[\s\S]*?\*\/|\/\/.*$/gm, "");
  ok("A9. tidak ada dead code pop-up pengaturan di app.js (SETTINGS_TARGET, settings-menu-item, settings-panel)", !/SETTINGS_TARGET|settings-menu-item|settings-panel/.test(cleanJs));
  const cssText = await fetchStyleCss(BASE);
  ok("A10. gaya .settings-menu lama ikut dibersihkan dari CSS", !/\.settings-menu\b/.test(cssText));

  // ================= B. layout tombol aksi =================
  ({ d, w } = await load("settings.html", 390));
  const rows = () => [...d.querySelectorAll("#data .settings-row--action, #reset-actions .settings-row--action")];
  ok("B1. enam baris aksi memakai layout baris-aksi (.settings-row--action)", rows().length === 6);
  ok("B2. semua tombol aksi ada & berfungsi sebagai tombol", ACTIONS.every(id => !!d.getElementById(id)) && RESETS.every(t => !!d.querySelector(`[data-reset-target="${t}"]`)));
  ok("B3. tombol Zona Berbahaya memakai warna danger (merah), tombol Data & Backup hijau", (() => {
    const probe = d.createElement("span"); probe.style.color = "var(--color-danger)"; d.body.append(probe);
    const danger = w.getComputedStyle(probe).color; probe.remove();
    const resetColors = RESETS.map(t => w.getComputedStyle(d.querySelector(`[data-reset-target="${t}"]`)).color);
    const exportColor = w.getComputedStyle(d.getElementById("btn-export-json")).color;
    return resetColors.every(c => c === danger) && exportColor !== danger;
  })());
  ok("B4. ukuran teks tombol aksi 12px & tinggi tap tetap >= 36px", rows().every(r => { const b = r.querySelector(".settings-row-action"); return w.getComputedStyle(b).fontSize === "12px" && b.getBoundingClientRect().height >= 36; }));
  ok("B5. judul & deskripsi tetap lengkap (hierarchy tidak hilang)", rows().every(r => txt(r.querySelector(".settings-row-title")).length > 0 && txt(r.querySelector(".settings-row-desc")).length > 0));
  ok("B6. teks peringatan penting tidak berubah", /File backup berisi data keuangan pribadi kamu/.test(txt(d.getElementById("data"))) && /Reset tidak bisa dibatalkan/.test(txt(d.getElementById("reset-actions"))));
  ok("B7. Profil Akun tidak disentuh (form, input nama, preview, tombol simpan tetap)", !!d.getElementById("settings-profile-form") && !!d.getElementById("settings-name") && !!d.getElementById("settings-name-preview") && txt(d.getElementById("settings-name-save")) === "Simpan Perubahan");

  // ================= C. responsive =================
  for (const wd of [320, 375, 430, 768, 1024, 1280]) {
    const r = await load("settings.html", wd);
    const de = r.d.documentElement;
    const list = [...r.d.querySelectorAll("#data .settings-row--action, #reset-actions .settings-row--action")];
    const inline = list.map(row => {
      const btn = row.querySelector(".settings-row-action").getBoundingClientRect();
      const body = row.querySelector(".settings-row-body").getBoundingClientRect();
      const card = row.closest(".settings-card").getBoundingClientRect();
      return { sejajar: btn.top < body.bottom - 1, diDalamCard: btn.right <= card.right + 0.5 && btn.left >= card.left - 0.5, tap: btn.height >= 36 && btn.width >= 40 };
    });
    const noOverflow = de.scrollWidth === de.clientWidth && list.every(row => row.scrollWidth <= row.clientWidth + 1);
    const expectInline = wd > 360;
    ok(`C-${wd}. tanpa overflow; tombol ${expectInline ? "sejajar di kanan" : "turun ke baris sendiri"}; tetap di dalam card & mudah ditap`,
      noOverflow && inline.every(x => x.diDalamCard && x.tap && x.sejajar === expectInline),
      `sw=${de.scrollWidth} cw=${de.clientWidth} ${JSON.stringify(inline[0])}`);
  }

  // ================= D. fungsi tetap jalan =================
  ({ d, w } = await load("settings.html"));
  seed(w);
  ({ d, w } = await load("settings.html"));
  const files = []; let blob = null;
  const realCreate = w.URL.createObjectURL.bind(w.URL); const realClick = w.HTMLAnchorElement.prototype.click;
  w.URL.createObjectURL = (b) => { blob = b; return "blob:stub"; };
  w.HTMLAnchorElement.prototype.click = function () { if (this.download) files.push(this.download); else realClick.call(this); };
  d.getElementById("btn-export-json").click(); d.getElementById("btn-export-csv").click(); await wait(250);
  ok("D1. export JSON & CSV tetap berfungsi", files.length === 2 && /\.json$/.test(files[0]) && /\.csv$/.test(files[1]), JSON.stringify(files));
  w.URL.createObjectURL = realCreate; w.HTMLAnchorElement.prototype.click = realClick;

  const input = d.getElementById("import-file");
  const dt = new w.DataTransfer(); dt.items.add(new w.File([IMPORT_FILE], "backup.json", { type: "application/json" }));
  input.files = dt.files; input.dispatchEvent(new w.Event("change", { bubbles: true }));
  for (let i = 0; i < 40 && d.getElementById("import-modal-overlay").hidden; i += 1) await wait(100);
  ok("D2. import tetap berfungsi: modal konfirmasi terbuka dengan ringkasan", !d.getElementById("import-modal-overlay").hidden && d.querySelectorAll("#import-modal-summary .settings-meta-row").length > 0);
  d.getElementById("btn-import-cancel").click(); await wait(300);
  ok("D3. batal import: modal tertutup, data tidak berubah", d.getElementById("import-modal-overlay").hidden && JSON.parse(w.localStorage.getItem("financeData.transactions")).length === 1);

  d.querySelector('[data-reset-target="budget"]').click(); await wait(300);
  ok("D4. modal reset tetap tampil normal dengan judul & ringkasan yang benar", !d.getElementById("reset-modal-overlay").hidden && txt(d.getElementById("reset-modal-title")) === "Reset Budget & Kategori?" && d.querySelectorAll("#reset-modal-summary .settings-meta-row").length === 4);
  const lsBefore = w.localStorage.getItem("financeData.budget");
  d.getElementById("btn-reset-cancel").click(); await wait(300);
  ok("D5. batal reset: modal tertutup, budget tidak berubah", d.getElementById("reset-modal-overlay").hidden && w.localStorage.getItem("financeData.budget") === lsBefore);
  let reloads = 0; w.reloadPage = () => { reloads += 1; };
  d.querySelector('[data-reset-target="transactions"]').click(); await wait(300);
  d.getElementById("btn-reset-confirm").click(); await wait(300);
  ok("D6. reset transaksi tetap bekerja (key transaksi terhapus, budget utuh, reload 1x)", w.localStorage.getItem("financeData.transactions") === null && w.localStorage.getItem("financeData.budget") === lsBefore && reloads === 1);

  // ================= E. UX-3B: satu area status untuk export/import/reset =================
  ({ d, w } = await load("settings.html"));
  seed(w);
  ({ d, w } = await load("settings.html"));
  const status = () => d.getElementById("settings-data-status");
  ok("E1. hanya SATU area status di card Data & Backup (#settings-data-status)", !!status() && d.querySelectorAll("#data .settings-feedback").length === 1 && !d.getElementById("settings-import-feedback") && !d.getElementById("settings-data-feedback"));
  ok("E2. atribut aksesibilitas dipertahankan & tersembunyi sebelum ada aksi", status().getAttribute("role") === "status" && status().getAttribute("aria-live") === "polite" && status().hidden && status().classList.contains("settings-feedback"));
  // export CSV tanpa transaksi -> error (menetap)
  try { w.localStorage.setItem("financeData.transactions", JSON.stringify([])); } catch (e) {}
  ({ d, w } = await load("settings.html"));
  d.getElementById("btn-export-csv").click(); await wait(200);
  ok("E3. pesan error export tampil di area yang sama & menetap", !status().hidden && status().dataset.type === "error" && /Belum ada transaksi/.test(txt(status())));
  // aksi berikutnya (import file rusak) menggantikan pesan, tidak menumpuk
  const badInput = d.getElementById("import-file");
  const badDt = new w.DataTransfer(); badDt.items.add(new w.File(["{rusak"], "backup.json", { type: "application/json" }));
  badInput.files = badDt.files; badInput.dispatchEvent(new w.Event("change", { bubbles: true }));
  for (let i = 0; i < 40 && !/bukan file backup JSON/.test(txt(status())); i += 1) await wait(100);
  ok("E4. pesan import menggantikan pesan export (tidak menumpuk)", d.querySelectorAll("#data .settings-feedback:not([hidden])").length === 1 && /bukan file backup JSON/.test(txt(status())) && !/Belum ada transaksi/.test(txt(status())));
  // reset dibatalkan -> pesan reset di area yang sama
  d.querySelector('[data-reset-target="settings"]').click(); await wait(300);
  d.getElementById("btn-reset-cancel").click(); await wait(350);
  ok("E5. pesan reset memakai area yang sama", /Reset dibatalkan/.test(txt(status())) && d.querySelectorAll("#data .settings-feedback:not([hidden])").length === 1);
  // sukses hilang sendiri, error menetap
  try { w.localStorage.setItem("financeData.transactions", JSON.stringify(SEED_TX)); } catch (e) {}
  ({ d, w } = await load("settings.html"));
  const rc = w.URL.createObjectURL.bind(w.URL), rcl = w.HTMLAnchorElement.prototype.click;
  w.URL.createObjectURL = () => "blob:stub"; w.HTMLAnchorElement.prototype.click = function () { if (!this.download) rcl.call(this); };
  d.getElementById("btn-export-json").click(); await wait(200);
  ok("E6. pesan sukses tampil (type=success)", !status().hidden && status().dataset.type === "success" && /Backup tersimpan/.test(txt(status())));
  await wait(4200);
  ok("E7. pesan sukses hilang sendiri setelah ~4 detik", status().hidden);
  d.getElementById("btn-export-csv").click(); await wait(200);
  const csvOk = !status().hidden;
  w.URL.createObjectURL = rc; w.HTMLAnchorElement.prototype.click = rcl;
  ok("E8. aksi berikutnya menampilkan pesan lagi di area yang sama", csvOk && /transaksi tersimpan sebagai/.test(txt(status())));
  ok("E9. alias lama tetap tersedia (kompatibilitas) & menulis ke area yang sama", typeof w.showDataFeedback === "function" && typeof w.showImportFeedback === "function" && typeof w.showDataStatus === "function" && (() => { w.showImportFeedback("uji alias", "error"); return txt(status()) === "uji alias" && status().dataset.type === "error"; })());
  // modal punya area statusnya sendiri, tidak ikut disatukan
  ok("E10. status di dalam modal import & reset tetap terpisah", !!d.getElementById("import-modal-status") && !!d.getElementById("reset-modal-status"));

  ok("E. console 0 error", errors.length === 0, errors.join(" | "));
  try { w.localStorage.clear(); } catch (e) {}
  document.getElementById("r").textContent = out.join("\n");
})().catch(e => { out.push("EXCEPTION " + e.stack); document.getElementById("r").textContent = out.join("\n"); });
</script>
