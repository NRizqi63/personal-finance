<!doctype html>
<meta charset="utf-8">
<pre id="r">running…</pre>
<script>
/* UI-2a — Payment Method Management (memilih metode mana yang aktif).

   1 : lapisan data di core.js (helper + aturan minimal satu aktif)
   2 : persistensi (simpan, muat ulang, data rusak, key sampah)
   3 : selector transaksi hanya menampilkan metode AKTIF
   4 : transaksi lama bermetode nonaktif tetap utuh saat diedit
   5 : layar "Kelola Metode Pembayaran" di halaman Pengaturan
   6 : gagal simpan -> state di-rollback, user diberi tahu
   7 : pagar tahap — UI-2b (metode custom), P-3/P-4/P-5 belum tersentuh

   Metode BAWAAN tidak pernah dihapus, hanya dimatikan; itulah sebabnya tidak
   ada satu pun test di sini yang mengharapkan transaksi berubah. */
const out = []; const ok = (n, c, x = "") => out.push(`${c ? "PASS" : "FAIL"} ${n}${x ? "  (" + x + ")" : ""}`);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const BASE = new URL("../../frontend/", location.href).href;
const KEY = "financeData.paymentMethods";

const pad = (n) => String(n).padStart(2, "0");
const T = (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
const TX = (method) => [{ id: 1, title: "Kopi", category: "makanan", type: "expense", amount: 25000, isoDate: T, time: "", method }];

let frame = null;
/** Muat halaman dengan localStorage yang sudah disiapkan (seed dijalankan di
 * konteks iframe, sebelum halaman yang diuji dibuka). */
async function load(page = "index.html", seed = () => {}) {
  if (frame) frame.remove();
  frame = document.createElement("iframe"); frame.width = 390; frame.height = 1600;
  frame.src = BASE + "index.html"; document.body.appendChild(frame);
  await new Promise(r => frame.onload = r);
  try {
    const w0 = frame.contentWindow;
    w0.localStorage.clear(); w0.sessionStorage.clear();
    w0.sessionStorage.setItem("checkinDismissed", "true");
    seed(w0);
  } catch (e) {}
  frame.remove();
  frame = document.createElement("iframe"); frame.width = 390; frame.height = 1600; frame.src = BASE + page;
  document.body.appendChild(frame);
  await new Promise(r => frame.onload = r); await wait(350);
  const r = { d: frame.contentDocument, w: frame.contentWindow, errors: [] };
  r.w.addEventListener("error", e => r.errors.push(e.message));
  r.w.console.error = (...a) => r.errors.push("console.error " + a.join(" "));
  return r;
}
const seedDisabled = (list) => (w) => w.localStorage.setItem(KEY, JSON.stringify({ disabled: list }));
const seedRaw = (raw) => (w) => w.localStorage.setItem(KEY, raw);
const call = (w, fn, ...args) => { try { return { value: w.eval(`(${fn}).apply(null, ${JSON.stringify(args)})`) }; } catch (e) { return { threw: e.message }; } };
const tiles = (d) => [...d.querySelectorAll("#method-grid .method-option[data-method]")];
const shown = (d) => tiles(d).filter(t => !t.hidden).map(t => t.dataset.method);
const options = (d) => [...d.getElementById("field-method").options].map(o => o.value);
const stored = (w) => JSON.parse(w.localStorage.getItem("financeData.transactions") || "[]");
const tap = async (el) => { el.focus(); el.click(); await wait(220); };
const fire = (w, el, type) => el.dispatchEvent(new w.Event(type, { bubbles: true }));

(async () => {
  const srcOf = {};
  for (const f of ["core.js", "transactions-shared.js", "settings.js", "dashboard.js", "transactions.js", "analytics.js", "budget.js", "goals.js"]) {
    srcOf[f] = await (await fetch(BASE + "js/" + f)).text();
  }

  /* ============ 1. LAPISAN DATA ============ */
  let r = await load("index.html"); let d = r.d, w = r.w;
  const ALL = w.eval("PAYMENT_METHOD_KEYS");
  ok("1a. tanpa key tersimpan: SEMUA metode bawaan aktif (user lama tidak kehilangan apa pun)", w.eval("getActivePaymentMethods().map(m => m.key).join()") === ALL.join(), w.eval("getActivePaymentMethods().length") + " aktif");
  ok("1b. financeData.paymentMethods = daftar yang DIMATIKAN + daftar metode buatan user, keduanya kosong untuk user baru", JSON.stringify(w.eval("financeData.paymentMethods")) === '{"disabled":[],"custom":[]}', JSON.stringify(w.eval("financeData.paymentMethods")));
  ok("1c. isPaymentMethodActive: true untuk semua bawaan, false untuk key legacy/asing/kosong", ALL.every(k => call(w, "isPaymentMethodActive", k).value === true) && ["debit", "mbanking", "qris", "", "__proto__", "constructor"].every(k => call(w, "isPaymentMethodActive", k).value === false));
  ok("1d. getActivePaymentMethods mengembalikan objek metode utuh & urutannya urutan kanonik", w.eval("getActivePaymentMethods().every(m => typeof m.key === 'string' && typeof m.name === 'string' && typeof m.logo === 'string')") === true && w.eval("getActivePaymentMethods().map(m => m.key).join()") === w.eval("PAYMENT_METHODS.map(m => m.key).join()"));
  ok("1e. setPaymentMethodActive menolak key yang bukan metode bawaan (legacy, asing, key bawaan Object)", ["debit", "qris", "__proto__", "toString", ""].every(k => call(w, "setPaymentMethodActive", k, false).value === false) && w.eval("financeData.paymentMethods.disabled.length") === 0);
  ok("1f. mematikan satu metode mengubah daftar aktif, tanpa menyentuh PAYMENT_METHODS", (() => {
    w.eval('setPaymentMethodActive("ovo", false)');
    return w.eval("getActivePaymentMethods().length") === ALL.length - 1 && w.eval("PAYMENT_METHODS.length") === ALL.length && !w.eval("getActivePaymentMethods().some(m => m.key === 'ovo')");
  })());
  ok("1g. mengaktifkan kembali mengembalikannya ke posisi kanonik (bukan ditempel di akhir)", (() => {
    w.eval('setPaymentMethodActive("ovo", true)');
    return w.eval("getActivePaymentMethods().map(m => m.key).join()") === ALL.join();
  })());
  ok("1h. idempoten: mematikan/menyalakan dua kali tidak menduplikasi entri", (() => {
    w.eval('setPaymentMethodActive("dana", false); setPaymentMethodActive("dana", false); setPaymentMethodActive("gopay", true);');
    return JSON.stringify(w.eval("financeData.paymentMethods.disabled")) === '["dana"]';
  })());
  ok("1i. ATURAN: metode terakhir tidak bisa dimatikan — penolakan ada di lapisan data, bukan cuma di UI", (() => {
    const sisa = ALL.filter(k => k !== "shopeepay");
    w.eval(`(${JSON.stringify(sisa)}).forEach(k => setPaymentMethodActive(k, false))`);
    const before = w.eval("getActivePaymentMethods().map(m => m.key).join()");
    const hasil = call(w, "setPaymentMethodActive", "shopeepay", false).value;
    return before === "shopeepay" && hasil === false && w.eval("getActivePaymentMethods().length") === 1;
  })());
  ok("1j. countTransactionsByMethod menghitung transaksi, bukan menyentuhnya", (() => {
    const sebelum = w.eval("JSON.stringify(financeData.transactions)");
    const n = call(w, "countTransactionsByMethod", "cash").value;
    return n === 0 && w.eval("JSON.stringify(financeData.transactions)") === sebelum;
  })());

  /* ============ 2. PERSISTENSI ============ */
  r = await load("index.html", seedDisabled(["ovo", "linkaja"])); d = r.d; w = r.w;
  ok("2a. pilihan tersimpan dibaca saat halaman dibuka", w.eval("getActivePaymentMethods().length") === ALL.length - 2 && !w.eval("isPaymentMethodActive('ovo')") && !w.eval("isPaymentMethodActive('linkaja')"));
  ok("2b. savePaymentMethods menulis HANYA key-nya sendiri, bentuk { disabled: [...] }", (() => {
    w.eval('setPaymentMethodActive("dana", false); savePaymentMethods();');
    const raw = JSON.parse(w.localStorage.getItem(KEY) || "{}");
    return raw.disabled.join() === "ovo,linkaja,dana" && Array.isArray(raw.custom) && raw.custom.length === 0
      && Object.keys(raw).sort().join() === "custom,disabled" && w.localStorage.getItem("financeData.transactions") === null;
  })(), w.localStorage.getItem(KEY));
  r = await load("index.html", seedRaw('{"disabled":["ovo","tidak-ada","__proto__","ovo","debit"]}')); w = r.w;
  ok("2c. key sampah, key legacy, dan duplikat dibuang saat memuat", JSON.stringify(w.eval("financeData.paymentMethods.disabled")) === '["ovo"]' && w.eval("({}).polluted === undefined && Object.prototype.polluted === undefined"), JSON.stringify(w.eval("financeData.paymentMethods.disabled")));
  r = await load("index.html", seedRaw(JSON.stringify({ disabled: ALL }))); w = r.w;
  ok("2d. data yang mematikan SEMUA metode ditolak seluruhnya (aplikasi tidak boleh tanpa metode)", w.eval("getActivePaymentMethods().length") === ALL.length);
  for (const [nama, raw] of [["bukan JSON", "{rusak"], ["bukan objek", '"teks"'], ["null", "null"], ["disabled bukan array", '{"disabled":"ovo"}'], ["tanpa disabled", '{"lain":1}'], ["array di akar", '["ovo"]']]) {
    r = await load("index.html", seedRaw(raw)); w = r.w;
    ok(`2e. data rusak (${nama}) diabaikan, semua metode tetap aktif & tanpa error`, w.eval("getActivePaymentMethods().length") === ALL.length && r.errors.length === 0, r.errors.join(" | "));
  }
  ok("2f. memuat TIDAK menulis apa pun ke localStorage (hanya disimpan saat user mengubah)", w.localStorage.getItem(KEY) === '["ovo"]');

  /* ============ 3. SELECTOR HANYA METODE AKTIF ============ */
  for (const page of ["index.html", "transactions.html"]) {
    r = await load(page, seedDisabled(["cash", "ovo", "linkaja"])); d = r.d; w = r.w;
    const aktif = ALL.filter(k => !["cash", "ovo", "linkaja"].includes(k));
    ok(`3a. ${page}: markup tetap 11 tombol (pendekatan A: disembunyikan, bukan dihapus)`, tiles(d).length === 11, String(tiles(d).length));
    ok(`3b. ${page}: yang TERLIHAT persis metode aktif, urutan kanonik`, shown(d).join() === aktif.join(), shown(d).join());
    ok(`3b2. ${page}: metode nonaktif benar-benar tidak dirender (display:none), bukan sekadar beratribut hidden`, tiles(d).every((t) => {
      const tampil = w.getComputedStyle(t).display !== "none";
      return tampil === aktif.includes(t.dataset.method);
    }), tiles(d).filter(t => w.getComputedStyle(t).display !== "none").map(t => t.dataset.method).join());
    ok(`3b3. ${page}: tombol nonaktif juga tidak punya luas di layar (tidak menyisakan lubang di grid)`, tiles(d).filter(t => t.hidden).every((t) => t.getBoundingClientRect().width === 0 && t.getBoundingClientRect().height === 0));
    ok(`3c. ${page}: <option> juga persis metode aktif — grid & select dari SATU sumber`, options(d).join() === aktif.join(), options(d).join());
    ok(`3d. ${page}: tombol nonaktif tidak menyisakan state aktif & tidak bisa jadi tab stop`, tiles(d).filter(t => t.hidden).every(t => t.getAttribute("aria-checked") === "false" && t.tabIndex === -1 && !t.classList.contains("is-active")));
    // Halaman Semua Transaksi tidak punya tombol "Tambah" (modalnya cuma untuk
    // edit), jadi di sana modal dibuka lewat pemicu yang sama dipakai aplikasi.
    if (page === "index.html") await tap(d.querySelector('[data-action="add-transaction"]'));
    else { w.eval('openTransactionModal("add")'); await wait(220); }
    ok(`3e. ${page}: transaksi BARU default ke metode aktif pertama (Cash dimatikan -> bca-mobile)`, d.getElementById("field-method").value === "bca-mobile" && d.querySelector("#method-grid .method-option.is-active").dataset.method === "bca-mobile", d.getElementById("field-method").value);
    ok(`3f. ${page}: hanya satu tab stop, dan tab stop itu tombol yang terlihat`, (() => {
      const tab = tiles(d).filter(t => t.tabIndex === 0);
      return tab.length === 1 && !tab[0].hidden;
    })());
  }

  // navigasi panah melewati yang tersembunyi
  r = await load("index.html", seedDisabled(["brimo", "livin", "mybca"])); d = r.d; w = r.w;
  await tap(d.querySelector('[data-action="add-transaction"]'));
  const press = (el, key) => { const ev = new w.KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }); el.dispatchEvent(ev); return ev; };
  d.querySelector('.method-option[data-method="bca-mobile"]').focus();
  press(d.activeElement, "ArrowRight"); await wait(60);
  ok("3g. ArrowRight MELEWATI metode nonaktif (bca-mobile -> wondr, bukan brimo)", d.activeElement.dataset.method === "wondr" && d.getElementById("field-method").value === "wondr", d.activeElement.dataset.method);
  press(d.activeElement, "ArrowLeft"); await wait(60);
  ok("3h. ArrowLeft juga melewatinya (kembali ke bca-mobile)", d.activeElement.dataset.method === "bca-mobile");
  press(d.activeElement, "End"); await wait(60);
  ok("3i. End ke tombol TERLIHAT terakhir", d.activeElement.dataset.method === "linkaja");
  press(d.activeElement, "ArrowRight"); await wait(60);
  ok("3j. wrap hanya berputar di antara yang terlihat", d.activeElement.dataset.method === "cash");
  // simpan transaksi baru
  const set = (id, v) => { const f = d.getElementById(id); f.value = v; fire(w, f, "input"); fire(w, f, "change"); };
  d.querySelector('.method-option[data-method="gopay"]').click(); await wait(80);
  set("field-title", "Kopi"); set("field-amount", "20000"); set("field-date", T);
  d.getElementById("field-category").value = "makanan";
  d.getElementById("transaction-form").requestSubmit(); await wait(300);
  ok("3k. transaksi baru tersimpan dengan metode aktif yang dipilih", stored(w)[0] && stored(w)[0].method === "gopay", JSON.stringify(stored(w)[0] || {}));
  ok("3l. tanpa error konsol di seluruh alur selector", r.errors.length === 0, r.errors.join(" | "));

  /* ============ 4. TRANSAKSI LAMA BERMETODE NONAKTIF ============ */
  r = await load("transactions.html", (w0) => {
    w0.localStorage.setItem(KEY, JSON.stringify({ disabled: ["ovo"] }));
    w0.localStorage.setItem("financeData.transactions", JSON.stringify(TX("ovo")));
  });
  d = r.d; w = r.w;
  await tap(d.querySelector('#all-transaction-list [data-action="edit"]'));
  const mati = d.querySelector("#method-grid .method-option.is-legacy");
  ok("4a. tombol non-aktif MUNCUL untuk metode yang dimatikan, dengan sebab yang jelas", !!mati && mati.querySelector(".method-name").textContent.trim() === "OVO — nonaktif", mati ? mati.textContent.trim() : "(tidak ada)");
  ok("4b. tombol itu tidak bisa dipilih & tidak ikut navigasi (disabled, tanpa data-method)", mati.disabled && mati.getAttribute("aria-disabled") === "true" && mati.tabIndex === -1 && !mati.dataset.method);
  ok("4c. logonya tetap logo metode itu (bukan ikon generik)", !!mati.querySelector('img[src="assets/payment-methods/ovo.svg"]'), (mati.querySelector("img") || {}).src || "emoji");
  ok("4d. <select> tidak punya opsinya, jadi nilai form kosong (selectedIndex -1)", d.getElementById("field-method").value === "" && d.getElementById("field-method").selectedIndex === -1);
  d.getElementById("transaction-form").requestSubmit(); await wait(300);
  ok("4e. ATURAN 10: menyimpan ulang MEMPERTAHANKAN metode nonaktifnya", stored(w)[0].method === "ovo", String(stored(w)[0].method));
  ok("4f. transaksi tidak berubah selain itu (tidak ada data yang hilang)", stored(w).length === 1 && stored(w)[0].title === "Kopi" && stored(w)[0].amount === 25000);
  await tap(d.querySelector('#all-transaction-list [data-action="edit"]'));
  d.querySelector('.method-option[data-method="dana"]').click(); await wait(80);
  ok("4g. user tetap bisa menggantinya ke metode aktif, dan tombol non-aktif ikut hilang", d.getElementById("field-method").value === "dana" && !d.querySelector("#method-grid .method-option.is-legacy"));
  d.getElementById("transaction-form").requestSubmit(); await wait(300);
  ok("4h. penggantian tersimpan", stored(w)[0].method === "dana");
  // key legacy versi pertama tidak ikut berubah perilakunya
  r = await load("transactions.html", (w0) => {
    w0.localStorage.setItem("financeData.transactions", JSON.stringify(TX("debit")));
  });
  d = r.d; w = r.w;
  await tap(d.querySelector('#all-transaction-list [data-action="edit"]'));
  ok("4i. key legacy versi pertama tetap berlabel \"tidak lagi tersedia\" (tidak tertukar dengan \"nonaktif\")", (d.querySelector("#method-grid .method-option.is-legacy") || {}).textContent.includes("Debit — tidak lagi tersedia"));
  d.getElementById("transaction-form").requestSubmit(); await wait(300);
  ok("4j. metode legacy juga tetap dipertahankan saat disimpan ulang", stored(w)[0].method === "debit");

  /* ============ 5. LAYAR KELOLA (settings.html) ============ */
  r = await load("settings.html", (w0) => {
    w0.localStorage.setItem("financeData.transactions", JSON.stringify([
      { id: 1, title: "a", category: "makanan", type: "expense", amount: 1000, isoDate: T, time: "", method: "gopay" },
      { id: 2, title: "b", category: "makanan", type: "expense", amount: 2000, isoDate: T, time: "", method: "gopay" },
    ]));
  });
  d = r.d; w = r.w;
  const rows = () => [...d.querySelectorAll("#method-manage-list .settings-row")];
  const toggle = (key) => d.getElementById("method-toggle-" + key);
  const rowOf = (key) => rows().find(row => row.getAttribute("for") === "method-toggle-" + key);
  const statusText = () => d.getElementById("method-manage-status").textContent;
  ok("5a. ada pintu masuk \"Kelola\" di Pengaturan, modalnya tertutup saat halaman dibuka", !!d.getElementById("btn-manage-methods") && d.getElementById("method-manage-overlay").hidden === true);
  ok("5b. daftar TIDAK ada di markup — dibangun saat modal dibuka", rows().length === 0 && d.getElementById("method-manage-list").children.length === 0);
  await tap(d.getElementById("btn-manage-methods"));
  ok("5c. modal terbuka & berisi 11 baris, urutan sama dengan PAYMENT_METHODS", !d.getElementById("method-manage-overlay").hidden && rows().length === 11 && rows().map(x => x.getAttribute("for").replace("method-toggle-", "")).join() === ALL.join());
  ok("5d. setiap baris: nama metode + saklar role=switch yang mencerminkan status", rows().every((row, i) => {
    const input = row.querySelector(".switch-input");
    return row.querySelector(".settings-row-title").textContent === w.eval(`PAYMENT_METHODS[${i}].name`) && input.getAttribute("role") === "switch" && input.checked === true;
  }));
  ok("5e. jumlah transaksi ditampilkan supaya konsekuensinya jelas sebelum dimatikan", rowOf("gopay").querySelector(".settings-row-desc").textContent === "Dipakai 2 transaksi" && rowOf("dana").querySelector(".settings-row-desc").textContent === "Belum dipakai transaksi", rowOf("gopay").querySelector(".settings-row-desc").textContent);
  ok("5f. ringkasan jumlah aktif tampil", d.getElementById("method-manage-count").textContent === "11 dari 11 metode aktif.", d.getElementById("method-manage-count").textContent);
  // matikan satu
  toggle("gopay").checked = false; fire(w, toggle("gopay"), "change"); await wait(200);
  ok("5g. mematikan metode langsung tersimpan (tanpa tombol Simpan)", (() => { const raw = JSON.parse(w.localStorage.getItem(KEY) || "{}"); return raw.disabled.join() === "gopay" && raw.custom.length === 0; })(), w.localStorage.getItem(KEY));
  ok("5h. keterangannya berubah & menegaskan transaksi lama aman", rowOf("gopay").querySelector(".settings-row-desc").textContent === "Nonaktif — 2 transaksi lama aman");
  ok("5i. transaksi TIDAK disentuh sama sekali", stored(w).length === 2 && stored(w).every(tx => tx.method === "gopay"));
  ok("5j. ada konfirmasi tertulis untuk user", /GoPay dimatikan/.test(statusText()), statusText());
  ok("5k. fokus tetap di saklar yang barusan diubah (daftar dibangun ulang)", d.activeElement === toggle("gopay"));
  // nyalakan lagi
  toggle("gopay").checked = true; fire(w, toggle("gopay"), "change"); await wait(200);
  ok("5l. ATURAN 4: metode bawaan bisa diaktifkan kembali", JSON.parse(w.localStorage.getItem(KEY) || "{}").disabled.length === 0 && /GoPay aktif kembali/.test(statusText()));
  ok("5m. tidak ada jalur HAPUS untuk metode bawaan (hanya saklar); tombol hapus hanya milik metode buatan user", rows().every(row => !!row.querySelector(".switch-input")) && rows().filter(row => !row.getAttribute("for").startsWith("method-toggle-user:")).every(row => !row.querySelector("button")) && !d.querySelector("#method-manage-list button[data-delete]"));
  // sisakan satu
  for (const k of ALL.filter(x => x !== "cash")) { const t = toggle(k); t.checked = false; fire(w, t, "change"); await wait(50); }
  ok("5n. tersisa satu metode aktif", w.eval("getActivePaymentMethods().map(m => m.key).join()") === "cash");
  ok("5o. ATURAN 7: saklar metode terakhir DIKUNCI supaya user tahu sebelum mencoba", toggle("cash").disabled === true && ALL.filter(k => k !== "cash").every(k => toggle(k).disabled === false));
  toggle("cash").checked = false; fire(w, toggle("cash"), "change"); await wait(200);
  ok("5p. dipaksa lewat event pun ditolak: masih satu aktif, saklar kembali ON, user diberi tahu", w.eval("getActivePaymentMethods().length") === 1 && toggle("cash").checked === true && /Minimal satu metode/.test(statusText()), statusText());
  ok("5q. yang tersimpan tetap 10 nonaktif (penolakan tidak ikut tersimpan)", JSON.parse(w.localStorage.getItem(KEY)).disabled.length === 10);
  ok("5r. tanpa error konsol sepanjang alur kelola", r.errors.length === 0, r.errors.join(" | "));

  /* ============ 6. GAGAL SIMPAN -> ROLLBACK ============ */
  r = await load("settings.html"); d = r.d; w = r.w;
  await tap(d.getElementById("btn-manage-methods"));
  const asli = w.localStorage.setItem.bind(w.localStorage);
  w.localStorage.setItem = (k, v) => { if (k === KEY) throw new Error("QuotaExceeded"); return asli(k, v); };
  d.getElementById("method-toggle-ovo").checked = false; fire(w, d.getElementById("method-toggle-ovo"), "change"); await wait(200);
  ok("6a. gagal simpan: state DI-ROLLBACK (ovo tetap aktif)", w.eval("getActivePaymentMethods().length") === 11 && w.eval("financeData.paymentMethods.disabled.length") === 0, JSON.stringify(w.eval("financeData.paymentMethods.disabled")));
  ok("6b. saklar kembali ke posisi semula", d.getElementById("method-toggle-ovo").checked === true);
  ok("6c. user diberi tahu, pesannya tidak menghilang sendiri", /tidak bisa disimpan/.test(statusText()) && d.getElementById("method-manage-status").dataset.type === "error", statusText());
  ok("6d. tidak ada yang tertulis ke localStorage", w.localStorage.getItem(KEY) === null);
  w.localStorage.setItem = asli;
  d.getElementById("method-toggle-ovo").checked = false; fire(w, d.getElementById("method-toggle-ovo"), "change"); await wait(200);
  ok("6e. setelah penyimpanan pulih, perubahan berikutnya tersimpan normal", JSON.parse(w.localStorage.getItem(KEY) || "{}").disabled.join() === "ovo");

  /* ============ 7. PAGAR TAHAP ============ */
  const codeOnly = (s) => s.replace(/\/\*[\s\S]*?\*\//g, "").replace(/(^|\s)\/\/.*$/gm, "$1");
  ok("7a. UI-2b2: jalur hapus metode custom HANYA ada di core.js (aturan) + settings.js (UI) — halaman lain tidak tahu apa-apa", /function deleteCustomPaymentMethod\(/.test(srcOf["core.js"]) && /deleteCustomPaymentMethod\(/.test(srcOf["settings.js"]) && ["transactions-shared.js", "dashboard.js", "transactions.js", "analytics.js", "budget.js", "goals.js"].every(f => !/deleteCustomPaymentMethod/.test(srcOf[f])));
  ok("7b. ATURAN: soft-delete (.deleted = true) ditulis TEPAT SEKALI di seluruh kode, dan hanya di dalam deleteCustomPaymentMethod", (() => {
    const semua = Object.values(srcOf).join("\n");
    const jumlah = (semua.match(/\.deleted = true/g) || []).length;
    const fn = (srcOf["core.js"].match(/function deleteCustomPaymentMethod\([\s\S]*?\n\}/) || [""])[0];
    return jumlah === 1 && /\.deleted = true/.test(fn) && /paymentMethods: \{ disabled: \[\], custom: \[\] \}/.test(srcOf["core.js"]);
  })());
  ok("7c. hanya core.js yang menyentuh key storage-nya", /const PAYMENT_METHODS_STORAGE_KEY = "financeData\.paymentMethods";/.test(srcOf["core.js"]) && ["transactions-shared.js", "settings.js", "dashboard.js", "transactions.js", "analytics.js", "budget.js", "goals.js"].every(f => !/PAYMENT_METHODS_STORAGE_KEY/.test(srcOf[f])));
  ok("7d. P-3 belum: renderer baris transaksi belum menampilkan metode", !/getPaymentLabel|transaction-method/.test((srcOf["core.js"].match(/function renderTransactionItem\([\s\S]*?\n\}/) || [""])[0]));
  ok("7e. P-4 belum: backup schema 2, CSV 7 kolom, dan pilihan metode TIDAK ikut di-backup", /const BACKUP_SCHEMA_VERSION = 2;/.test(srcOf["settings.js"]) && /const CSV_HEADER = \["tanggal", "jenis", "judul", "kategori", "kategori_nama", "jumlah", "waktu"\];/.test(srcOf["settings.js"]) && !/paymentMethods/.test((srcOf["settings.js"].match(/function buildBackup\([\s\S]*?\n\}/) || [""])[0]));
  ok("7f. P-4 belum: key metode tidak ikut ditulis/dihapus oleh import maupun reset", ["writeImportedData", "applyPendingImport", "applyDataReset", "importTargetKeys"].every(n => !/paymentMethods/.test((srcOf["settings.js"].match(new RegExp(`function ${n}\\([\\s\\S]*?\\n\\}`)) || [""])[0])));
  ok("7g. P-5 belum: filter & analitik belum mengenal metode", !/method/.test(srcOf["transactions.js"]) && !/method/.test(srcOf["analytics.js"]));

  document.getElementById("r").textContent = out.join("\n") + `\n\nTOTAL PASS=${out.filter(l => l.startsWith("PASS")).length} FAIL=${out.filter(l => l.startsWith("FAIL")).length}`;
})().catch(e => { document.getElementById("r").textContent = out.join("\n") + "\nEXCEPTION " + e.message + "\n" + e.stack; });
</script>
