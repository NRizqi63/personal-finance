<!doctype html>
<meta charset="utf-8">
<pre id="r">running…</pre>
<script>
const out = []; const ok = (n, c, x = "") => out.push(`${c ? "PASS" : "FAIL"} ${n}${x ? "  (" + x + ")" : ""}`);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const confirmDelete = async (d, w) => { const btn = d.getElementById("confirm-delete"); if (btn && !d.getElementById("confirm-modal-overlay").hidden) { btn.click(); await new Promise(r => setTimeout(r, 260)); } };

const BASE = new URL("../../frontend/", location.href).href;
let frame = null;
async function load(page, width = 390) {
  if (frame) frame.remove();
  frame = document.createElement("iframe"); frame.width = width; frame.height = 1400; frame.src = BASE + page;
  document.body.appendChild(frame);
  await new Promise(r => frame.onload = r); await wait(350);
  return { d: frame.contentDocument, w: frame.contentWindow };
}
const pad = (n) => String(n).padStart(2, "0");
const isoOf = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const txt = (el) => el.textContent.replace(/\s+/g, " ").trim();
const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

(async () => {
  let { d, w } = await load("transactions.html");
  try { w.localStorage.clear(); } catch (e) {}
  const today = new Date();
  const tIso = isoOf(today);
  const y = new Date(today); y.setDate(y.getDate() - 1); const yIso = isoOf(y);
  const other = new Date(today.getFullYear(), today.getMonth(), today.getDate() <= 15 ? 20 : 5); const oIso = isoOf(other);
  const seed = [
    { id: 1, title: "Makan Siang", category: "makanan", type: "expense", amount: 25000, isoDate: tIso, time: "12:30" },
    { id: 2, title: "Bensin Motor", category: "bensin", type: "expense", amount: 30000, isoDate: tIso, time: "09:15" },
    { id: 3, title: "Belanja", category: "belanja", type: "expense", amount: 50000, isoDate: tIso, time: "" },
    { id: 4, title: "Kopi", category: "makanan", type: "expense", amount: 20000, isoDate: tIso, time: "" },
    { id: 5, title: "Parkir", category: "lainnya", type: "expense", amount: 5000, isoDate: tIso, time: "" },
    { id: 6, title: "Gaji", category: "lainnya", type: "income", amount: 5000000, isoDate: yIso, time: "08:00" },
    { id: 7, title: "Tagihan Listrik", category: "tagihan", type: "expense", amount: 300000, isoDate: oIso, time: "" },
  ];
  w.localStorage.setItem("financeData.transactions", JSON.stringify(seed));
  ({ d, w } = await load("transactions.html"));
  w.confirm = () => true;

  // ---------- structure & styling ----------
  const cal = d.getElementById("calendar");
  ok("calendar sits between the filter bar and the transaction list (V2.1 order: header -> filter -> calendar -> list)", cal && cal.closest("section").previousElementSibling.classList.contains("tx-filters") && cal.closest("section").previousElementSibling.previousElementSibling.classList.contains("app-header") && cal.closest("section").nextElementSibling.classList.contains("transactions"));
  ok("custom calendar (no native <input type=date>), 7 weekday headers, 42 day cells", !d.querySelector('#calendar input') && d.querySelectorAll(".calendar-weekdays span").length === 7 && d.querySelectorAll(".calendar-day").length === 42);
  ok("header shows current month + prev/next buttons", txt(d.querySelector(".calendar-title")) === `${MONTHS[today.getMonth()]} ${today.getFullYear()}` && d.querySelectorAll(".calendar-nav").length === 2);
  const cs = w.getComputedStyle(cal);
  ok("design system: white rounded card with border", cs.backgroundColor === "rgb(255, 255, 255)" && parseFloat(cs.borderTopLeftRadius) >= 12);
  const navR = d.querySelector(".calendar-nav").getBoundingClientRect();
  ok("prev/next tap target >= 36px (44 with halo)", navR.width >= 36 && navR.height >= 36);
  const dayR = d.querySelector(".calendar-day").getBoundingClientRect();
  ok("day cells >= 36px tall, all visible", dayR.height >= 40 && [...d.querySelectorAll(".calendar-day")].every(b => b.getBoundingClientRect().width > 30));

  // ---------- default state ----------
  const todayBtn = d.querySelector(`.calendar-day[data-date="${tIso}"]`);
  ok("default selected = today (is-selected + is-today + aria-pressed)", todayBtn && todayBtn.classList.contains("is-selected") && todayBtn.classList.contains("is-today") && todayBtn.getAttribute("aria-pressed") === "true");
  ok("today has distinct style (primary bg when selected)", w.getComputedStyle(todayBtn).backgroundColor === "rgb(20, 83, 45)");
  ok("indicator dot on dates with transactions only", todayBtn.querySelector(".calendar-dot") && d.querySelector(`.calendar-day[data-date="${yIso}"] .calendar-dot`) && d.querySelector(`.calendar-day[data-date="${oIso}"] .calendar-dot`) && [...d.querySelectorAll(".calendar-day")].filter(b => b.querySelector(".calendar-dot")).length === 3);
  ok("title shows selected date in long form + 'Hari ini' hint", txt(d.getElementById("selected-date-title")) === `${today.getDate()} ${MONTHS[today.getMonth()]} ${today.getFullYear()}` && txt(d.getElementById("selected-date-hint")) === "Hari ini");

  // ---------- max 3 + lihat semua ----------
  const items = () => [...d.querySelectorAll("#all-transaction-list .transaction-item")];
  ok("today has 5 tx -> only 3 shown", items().length === 3);
  ok("'+ 2 transaksi lainnya' note + 'Lihat semua transaksi' button", !d.getElementById("transaction-list-more").hidden && txt(d.getElementById("transaction-list-more-note")) === "+ 2 transaksi lainnya" && txt(d.getElementById("btn-toggle-all")) === "Lihat semua transaksi");
  ok("cards: icon + Edit/Delete present, no bar", items().every(li => li.querySelector(".transaction-icon") && li.querySelector('[data-action="edit"]') && li.querySelector('[data-action="delete"]') && !li.querySelector(".transaction-bar")));
  ok("mobile: time hidden next to category", [...d.querySelectorAll("#all-transaction-list .transaction-time")].every(el => w.getComputedStyle(el).display === "none"));
  d.getElementById("btn-toggle-all").click(); await wait(100);
  ok("Lihat semua -> all 5 of TODAY only (no other dates)", items().length === 5 && items().every(li => seed.find(t => t.id === +li.dataset.id).isoDate === tIso));
  ok("button becomes 'Ringkas kembali', note hidden", txt(d.getElementById("btn-toggle-all")) === "Ringkas kembali" && d.getElementById("transaction-list-more-note").hidden && d.getElementById("btn-toggle-all").getAttribute("aria-expanded") === "true");
  d.getElementById("btn-toggle-all").click(); await wait(100);
  ok("Ringkas kembali -> back to 3", items().length === 3 && txt(d.getElementById("btn-toggle-all")) === "Lihat semua transaksi");

  // ---------- click other dates ----------
  d.querySelector(`.calendar-day[data-date="${yIso}"]`).click(); await wait(100);
  ok("click yesterday -> only its 1 tx (Gaji) shown, title + 'Kemarin' hint", items().length === 1 && /Gaji/.test(txt(items()[0])) && txt(d.getElementById("selected-date-hint")) === "Kemarin" && d.getElementById("transaction-list-more").hidden);
  ok("selection moved (yesterday selected, today no longer selected but still is-today)", d.querySelector(`.calendar-day[data-date="${yIso}"]`).classList.contains("is-selected") && !d.querySelector(`.calendar-day[data-date="${tIso}"]`).classList.contains("is-selected") && d.querySelector(`.calendar-day[data-date="${tIso}"]`).classList.contains("is-today"));
  // a date with no transactions in the visible grid
  const emptyBtn = [...d.querySelectorAll(".calendar-day")].find(b => !b.querySelector(".calendar-dot") && !b.classList.contains("is-outside"));
  emptyBtn.click(); await wait(100);
  ok("empty date -> '📭 Tidak ada transaksi pada tanggal ini.'", items().length === 0 && /📭 Tidak ada transaksi pada tanggal ini\./.test(txt(d.getElementById("all-transaction-list"))) && d.getElementById("selected-date-hint").hidden);
  // expanded state resets when switching date
  d.querySelector(`.calendar-day[data-date="${tIso}"]`).click(); await wait(50);
  d.getElementById("btn-toggle-all").click(); await wait(50);
  d.querySelector(`.calendar-day[data-date="${oIso}"]`).click(); await wait(50);
  d.querySelector(`.calendar-day[data-date="${tIso}"]`).click(); await wait(50);
  ok("expanded state resets when another date is selected", items().length === 3);

  // ---------- month navigation ----------
  d.querySelector('[data-cal-nav="1"]').click(); await wait(100);
  const next = new Date(today.getFullYear(), today.getMonth() + 1, 1);
  ok("next month: title updates, selection kept (today not visible as selected), grid still 42", txt(d.querySelector(".calendar-title")) === `${MONTHS[next.getMonth()]} ${next.getFullYear()}` && d.querySelectorAll(".calendar-day").length === 42 && items().length === 3);
  d.querySelector('[data-cal-nav="-1"]').click(); d.querySelector('[data-cal-nav="-1"]').click(); await wait(100);
  const prev = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  ok("prev month works (two steps back)", txt(d.querySelector(".calendar-title")) === `${MONTHS[prev.getMonth()]} ${prev.getFullYear()}`);
  // outside-month day click jumps the calendar to that month
  d.querySelector('[data-cal-nav="1"]').click(); await wait(50);
  const outside = d.querySelector(".calendar-day.is-outside");
  const outsideIso = outside.dataset.date; outside.click(); await wait(100);
  const od = new Date(`${outsideIso}T00:00:00`);
  ok("clicking an outside-month day selects it and moves the calendar to that month", txt(d.querySelector(".calendar-title")) === `${MONTHS[od.getMonth()]} ${od.getFullYear()}` && d.querySelector(`.calendar-day[data-date="${outsideIso}"]`).classList.contains("is-selected"));

  // ---------- CRUD still works on the date list ----------
  // kembali ke bulan berjalan dulu (kalender sedang di bulan tetangga)
  for (let i = 0; i < 3 && txt(d.querySelector(".calendar-title")) !== `${MONTHS[today.getMonth()]} ${today.getFullYear()}`; i++) {
    d.querySelector(od < today ? '[data-cal-nav="1"]' : '[data-cal-nav="-1"]').click(); await wait(50);
  }
  d.querySelector(`.calendar-day[data-date="${tIso}"]`).click(); await wait(50);
  d.getElementById("btn-toggle-all").click(); await wait(50); // Makan Siang (id 1) ada di luar 3 teratas
  [...d.querySelectorAll('[data-action="edit"]')].find(b => /Makan Siang/.test(b.getAttribute("aria-label"))).click(); await wait(300);
  ok("edit opens modal prefilled", !d.getElementById("transaction-modal-overlay").hidden && d.getElementById("field-title").value === "Makan Siang");
  d.getElementById("field-title").value = "Makan Siang Enak"; d.getElementById("transaction-form").requestSubmit(); await wait(300);
  ok("edit saved -> list re-rendered for the same date (still expanded), calendar intact", /Makan Siang Enak/.test(txt(d.getElementById("all-transaction-list"))) && items().length === 5 && d.querySelectorAll(".calendar-day").length === 42 && d.querySelector(`.calendar-day[data-date="${tIso}"]`).classList.contains("is-selected"));
  const n0 = JSON.parse(w.localStorage.getItem("financeData.transactions")).length;
  [...d.querySelectorAll('[data-action="delete"]')].find(b => /Bensin Motor/.test(b.getAttribute("aria-label"))).click(); await wait(260); await confirmDelete(d, w);
  ok("delete (from expanded list) works: storage -1, list stays expanded with 4", JSON.parse(w.localStorage.getItem("financeData.transactions")).length === n0 - 1 && items().length === 4);
  d.getElementById("btn-toggle-all").click(); await wait(50);
  ok("collapse -> 3 shown, note '+ 1 transaksi lainnya'", items().length === 3 && txt(d.getElementById("transaction-list-more-note")) === "+ 1 transaksi lainnya");
  // delete down to 3 -> more section hides
  [...d.querySelectorAll('[data-action="delete"]')][0].click(); await wait(260); await confirmDelete(d, w);
  ok("<= 3 tx -> 'Lihat semua' section hidden", items().length === 3 && d.getElementById("transaction-list-more").hidden);
  // dot disappears when a date loses all transactions
  d.querySelector(`.calendar-day[data-date="${yIso}"]`).click(); await wait(50);
  d.querySelector('[data-action="delete"]').click(); await wait(260); await confirmDelete(d, w);
  ok("dot removed when the date has no transactions left", !d.querySelector(`.calendar-day[data-date="${yIso}"] .calendar-dot`) && /📭/.test(txt(d.getElementById("all-transaction-list"))));

  // ---------- dashboard unchanged: preview only ----------
  ({ d, w } = await load("index.html"));
  const cc = d.getElementById("checkin-close"); if (cc) { cc.click(); await wait(200); }
  ok("dashboard still preview-only (no Edit/Delete, no calendar)", !d.querySelector('#transaction-list [data-action]') && !d.getElementById("calendar"));

  try { w.localStorage.clear(); } catch (e) {}
  document.getElementById("r").textContent = out.join("\n");
})().catch(e => { out.push("EXCEPTION " + e.stack); document.getElementById("r").textContent = out.join("\n"); });
</script>
